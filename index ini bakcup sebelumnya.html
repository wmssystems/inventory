<script>
const WMS_API_BASE = "https://script.google.com/macros/s/AKfycbwevovIh8eNMCyOdTPPmsElYCJXJPI1LCmtsFQnESYXpz5rheespn1LrUX3QFhsLdGGEQ/exec";
async function apiGet(action, params={}) {
  const q = new URLSearchParams({action, username:(user().Username||''), ...params});
  const r = await fetch(WMS_API_BASE + '?' + q.toString(), {method:'GET', credentials:'same-origin'});
  const text = await r.text();
  try { return JSON.parse(text); } catch(e) { throw new Error('Response API tidak valid: ' + text.slice(0,200)); }
}
async function apiPost(action, data={}) {
  const payload = {...data, action};
  const r = await fetch(WMS_API_BASE, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload), credentials:'same-origin'});
  const text = await r.text();
  try { return JSON.parse(text); } catch(e) { throw new Error('Response API tidak valid: ' + text.slice(0,300)); }
}
function makeRequestId(){return 'REQ-' + Date.now() + '-' + Math.random().toString(36).slice(2,10);}
function transactionFingerprint(action,data){return action+'|'+JSON.stringify(data);}
async function loginUser(username,password){return apiGet('login',{username,password});}
function logoutUser(){sessionStorage.removeItem('wmsUser');location.reload();}
</script>
<script>
const NAV=[['MAIN',[['dashboard','⌂','Dashboard']]],['MASTER DATA',[['master-part','▦','Master Part','ADMIN'],['warehouse','▣','Warehouse','ADMIN'],['customer','◉','Customer','ADMIN'],['bom','⌬','BOM','ADMIN'],['import-center','⇧','Import Center','ADMIN']]],['INBOUND & WAREHOUSE',[['scan','⌖','Scan / Operation'],['receiving','↓','Receiving'],['stock','▤','Stock'],['transfer','⇄','Transfer'],['issue','→','Issue Material']]],['PRODUCTION & QUALITY',[['production','⚙','Production'],['testing','✓','Testing / QC'],['material-ng','!','Material NG'],['hold','⏸','Product Hold']]],['SHIPPING',[['delivery','□','FG Delivery']]],['CONTROL & REPORT',[['stock-opname','⊙','Stock Opname'],['transactions','≡','Transactions']]]];
const META={scan:['Scan / Operation','Full-screen QR / Barcode operation'],dashboard:['Dashboard','Inventory Control & Warehouse Overview'], 'master-part':['Master Part','MasterPart'],warehouse:['Warehouse','Warehouse & Location'],customer:['Customer','Customer Master'],bom:['BOM','Bill of Material'],receiving:['Receiving','Supplier → STG'],stock:['Stock','InventoryBalance'],transfer:['Transfer','Warehouse Movement'],issue:['Issue Material','Warehouse → PROD'],production:['Production','Sub Assembly & Finish Product'],testing:['Testing / QC','PASS → FG | NG → HOLD'],'material-ng':['Material NG','PROD → MAT-NG'],hold:['Product Hold','TEST → HOLD'],delivery:['FG Delivery','FG → Customer'],'stock-opname':['Stock Opname','Physical Stock Validation'],transactions:['Transactions','Traceability']};
let CACHE={parts:[],warehouses:[],customers:[],stock:[],productionParts:{subAssembly:[],finishedGood:[]}};
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));} function fmt(x){return Number(x||0).toLocaleString('id-ID');}
function toast(msg,ok=true){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(ok?'ok':'err')+' show';setTimeout(()=>t.className='toast',3000)}
function user(){try{return JSON.parse(sessionStorage.getItem('wmsUser')||'{}')}catch{return {}}}
function isAdmin(){return String(user().Role||'').trim().toUpperCase()==='ADMIN'}
function canAccessPage(page){if(isAdmin())return true;return !['master-part','warehouse','customer','bom','import-center'].includes(page)}
function buildNav(){const admin=isAdmin();document.getElementById('nav').innerHTML=NAV.map(([sec,items])=>{const visible=items.filter(x=>!x[3]||admin);return visible.length?`<div class="nav-sec">${sec}</div>${visible.map(x=>`<button class="nav-item" data-page="${x[0]}"><i>${x[1]}</i>${x[2]}</button>`).join('')}`:''}).join('');document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>go(b.dataset.page));}
async function loadCache(){const jobs=[['parts','parts'],['warehouses','warehouses'],['customers','customers'],['stock','stock'],['productionParts','productionParts']];const results=await Promise.all(jobs.map(async([k,a])=>{try{return [k,await apiGet(a)]}catch(e){return [k,{success:false,error:e}]}}));results.forEach(([k,r])=>{if(r.success)CACHE[k]=r.data||[]});}
function go(page){if(!canAccessPage(page)){toast('Akses ditolak. Menu ini khusus ADMIN.',false);return;}if(page!=='scan'&&document.getElementById('scanPageWrap')?.classList.contains('scan-fullscreen-wrap')){exitScanFullscreen();}const m=META[page]||META.dashboard;document.getElementById('pageTitle').textContent=m[0];document.getElementById('pageSub').textContent=m[1];document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.page===page));document.getElementById('nav').classList.remove('open');if(page==='dashboard')dashboard();else if(page==='scan')scanPage();else if(page==='stock')stockPage();else if(page==='transactions')txPage();else if(page==='receiving')receivingPage();else if(page==='transfer')transferPage();else if(page==='issue')issuePage();else if(page==='production')productionPage();else if(page==='testing')testingPage();else if(page==='material-ng')materialNGPage();else if(page==='hold')holdPage();else if(page==='delivery')deliveryPage();else if(page==='stock-opname')opnamePage();else if(page==='master-part')masterPartPage();else if(page==='warehouse')warehousePage();else if(page==='customer')customerPage();else if(page==='bom')bomPage();else if(page==='import-center')importCenterPage();}
function shell(title,desc,body,action=''){document.getElementById('content').innerHTML=`<div class="page-head"><div><h3>${title}</h3><p>${desc}</p></div>${action}</div>${body}`}
function sel(name,items,placeholder='Select...'){return `<select id="${name}"><option value="">${placeholder}</option>${items.map(x=>`<option value="${esc(x.id)}">${esc(x.label)}</option>`).join('')}</select>`}
function parts(){return CACHE.parts.map(x=>({id:x.PartID,label:`${x.PartNumber} — ${x.PartName||''}`}));}
function productionParts(kind){
  const list = CACHE.productionParts?.[kind] || [];
  return list.map(x=>({id:x.PartID,label:`${x.PartNumber} — ${x.PartName||''}`}));
}function whs(){return CACHE.warehouses.map(x=>({id:x.WarehouseID,label:`${x.WarehouseCode} — ${x.WarehouseName}`}));}function custs(){return CACHE.customers.map(x=>({id:x.CustomerID,label:`${x.CustomerCode} — ${x.CustomerName}`}));}
function formCard(fields,submitText='Save'){return `<div class="form-card"><div class="form-grid">${fields.join('')}</div><div class="form-actions"><button class="btn ghost" onclick="go(document.querySelector('.nav-item.active')?.dataset.page||'dashboard')">Cancel</button><button class="btn primary" id="saveBtn">${submitText}</button></div></div>`}
function f(label,id,type='text',extra=''){return `<label class="field"><span>${label}</span><input id="${id}" type="${type}" ${extra}></label>`}function fs(label,id,html){return `<label class="field"><span>${label}</span>${html}</label>`}
async function dashboard(){shell('Dashboard','Inventory Control & Warehouse Overview',`<div class="dash-tools"><div><small>LIVE WMS MONITORING</small><h3>Inventory Control</h3></div><div class="filter-chip">All Warehouse · Today</div></div><div class="kpis">${['Total Stock','Stock Lines','Total Transactions',"Today's Transactions",'Active Parts'].map((x,i)=>`<div class="kpi k${i}"><span>${x}</span><b id="k${i}">-</b><small>Live from WMS</small></div>`).join('')}</div><div class="grid3"><div class="panel span2"><h4>Stock by Warehouse</h4><div id="whChart"></div></div><div class="panel"><h4>Top 5 Stock</h4><div id="topStock"></div></div><div class="panel"><h4>Stock by Category</h4><div id="catChart"></div></div><div class="panel span2"><h4>Recent Transactions</h4><div id="recent"></div></div><div class="panel"><h4>System Status</h4><div class="system-ok">● API Connected</div><small id="statusDetail">Loading...</small></div></div>`);try{const [d,t]=await Promise.all([apiGet('dashboard'),apiGet('transactions',{limit:8})]);if(!d.success)throw Error(d.message);const x=d.data;['totalStock','balanceLines','totalTransactions','todayTransactions'].forEach((k,i)=>document.getElementById('k'+i).textContent=fmt(x[k]));document.getElementById('k4').textContent=fmt(CACHE.parts.length);const wm={};CACHE.warehouses.forEach(w=>wm[w.WarehouseID]=w);const sums={};CACHE.stock.forEach(s=>sums[s.WarehouseID]=(sums[s.WarehouseID]||0)+Number(s.QtyOnHand||0));const max=Math.max(1,...Object.values(sums));document.getElementById('whChart').innerHTML=Object.entries(sums).sort((a,b)=>b[1]-a[1]).map(([id,q])=>`<div class="bar"><span>${esc(wm[id]?.WarehouseCode||id)}</span><div><i style="width:${q/max*100}%"></i></div><b>${fmt(q)}</b></div>`).join('')||'<div class="empty">No data</div>';const pm={};CACHE.parts.forEach(p=>pm[p.PartID]=p);const ps={};CACHE.stock.forEach(s=>ps[s.PartID]=(ps[s.PartID]||0)+Number(s.QtyOnHand||0));document.getElementById('topStock').innerHTML=Object.entries(ps).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,q],i)=>`<div class="rank"><em>${i+1}</em><span><b>${esc(pm[id]?.PartNumber||id)}</b><small>${esc(pm[id]?.PartName||'')}</small></span><strong>${fmt(q)}</strong></div>`).join('')||'<div class="empty">No data</div>';const cats={};Object.entries(ps).forEach(([id,q])=>{const c=pm[id]?.Category||'Other';cats[c]=(cats[c]||0)+q});const ct=Object.values(cats).reduce((a,b)=>a+b,0)||1;document.getElementById('catChart').innerHTML=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([c,q])=>`<div class="cat"><span>${esc(c)}</span><b>${Math.round(q/ct*100)}%</b><div><i style="width:${q/ct*100}%"></i></div></div>`).join('')||'<div class="empty">No data</div>';document.getElementById('recent').innerHTML=(t.data||[]).map(z=>`<div class="tx"><span><b>${esc(z.TransactionType)}</b><small>${esc(pm[z.PartID]?.PartNumber||z.PartID||'-')} · ${esc(z.BatchNo||'-')}</small></span><strong>${fmt(z.Qty)}</strong><small>${esc(z.CreatedBy||'-')}</small></div>`).join('')||'<div class="empty">No data</div>';document.getElementById('statusDetail').textContent=`${CACHE.stock.length} balance lines · ${t.data?.length||0} recent transactions loaded`;document.getElementById('apiState').textContent='● API Connected';document.getElementById('apiState').className='api-state good'}catch(e){document.getElementById('statusDetail').textContent=e.message;document.getElementById('apiState').textContent='● API Error';document.getElementById('apiState').className='api-state bad'}}
function stockPage(){
  const pm=Object.fromEntries(CACHE.parts.map(x=>[x.PartID,x]));
  const wm=Object.fromEntries(CACHE.warehouses.map(x=>[x.WarehouseID,x]));
  shell('Stock','Current inventory by part, batch and location',`
    <div class="panel quick-import"><div><b>Beginning Stock</b><p class="muted">Upload stok awal dari Excel dan post otomatis sebagai BEGINNING_STOCK.</p></div><div class="form-actions"><button class="btn ghost" onclick="openImport('stock')">↑ Upload Stock Awal</button><button class="btn ghost" onclick="openImport('stock');setTimeout(()=>document.getElementById('downloadTemplateBtn')?.click(),0)">↓ Template</button></div></div>
    <div class="table-card">
      <div class="warehouse-filter">
        <div class="warehouse-filter-title">Warehouse</div>
        <div id="warehouseTabs" class="warehouse-tabs"></div>
        <div id="stockSelected" class="stock-selected">Warehouse: ALL</div>
      </div>
      <div class="table-tools">
        <input id="stockSearch" placeholder="Search part / batch..." oninput="filterStock()">
        <button class="btn ghost" onclick="refreshStockPage()">↻ Refresh</button>
      </div>
      <div id="stockRows"></div>
    </div>`);

  window._stockWarehouse='ALL';
  window._stockRows=CACHE.stock.map(x=>({
    part:pm[x.PartID]?.PartNumber||x.PartID,
    partName:pm[x.PartID]?.PartName||'',
    warehouse:wm[x.WarehouseID]?.WarehouseCode||x.WarehouseID,
    warehouseId:x.WarehouseID,
    batch:x.BatchNo||'',
    qty:x.QtyOnHand,
    available:x.QtyAvailable
  }));

  renderWarehouseTabs();
  renderFilteredStock();
}

function renderWarehouseTabs(){
  const el=document.getElementById('warehouseTabs');
  if(!el)return;

function applyScanToTransaction(prefix,op,r){
  if(!r.masterPartId){setScanStatus(prefix,'Part terbaca tetapi belum terdaftar di MasterPart.',false);return false;}
  const partTargets={receive:'partId',transfer:'partId',issue:'partId',subAssembly:'saPart',finishProduct:'fpPart',testingPass:'tpPart',testingNG:'tnPart',materialNG:'ngPart',delivery:'diPart1'};
  const qtyTargets={receive:'qty',transfer:'qty',issue:'qty',subAssembly:'saQty',finishProduct:'fpQty',testingPass:'tpQty',testingNG:'tnQty',materialNG:'ngQty',delivery:'diQty1'};
  const batchTargets={receive:'batchNo',transfer:'batchNo',issue:'batchNo',subAssembly:'saBatch',finishProduct:'fpBatch',testingPass:'tpBatch',testingNG:'tnBatch',materialNG:'ngBatch',delivery:'diBatch1'};
  const uomTargets={receive:'uom',transfer:'uom',issue:'uom'};
  const partId=partTargets[op];
  if(partId && !setSelectValue(partId,r.masterPartId)){setScanStatus(prefix,'Part ditemukan di parser tetapi belum tersedia pada daftar Part di form.',false);return false;}
  if(qtyTargets[op] && r.qty!==null) setInputValue(qtyTargets[op],r.qty);
  if(batchTargets[op] && r.batchNo) setInputValue(batchTargets[op],r.batchNo);
  if(uomTargets[op]) setInputValue(uomTargets[op],r.uom||r.masterUom||'PCS');
  if(op==='receive' && r.po) setInputValue('referenceNo',r.po);
  if(op==='stockOpname'){
    setInputValue('scanOpPhysical',r.qty??'');
    setInputValue('scanOpBatch',r.batchNo||'');
    setSelectValue('scanOpPart',r.masterPartId);
    if(v('opWh')) setTimeout(applyOpScan,0);
  }
  setScanStatus(prefix,`✓ ${r.partNumber} | Qty: ${r.qty===null?'-':fmt(r.qty)} | Batch: ${r.batchNo||'-'}`,true);
  return true;
}

async function processScannedTransaction(){
  if(transactionBusy){toast('Transaksi sedang diproses. Tunggu sampai selesai.',false);return;}
  if(!lastScan || !lastScan.masterPartId){toast('Scan atau input manual Part Number yang sudah terdaftar di MasterPart.',false);return;}
  const op=selected('scanOperationType');
  const qty=Number(selected('scanQty')||0);
  const batch=selected('scanBatch');
  const uom=selected('scanUom')||lastScan.uom||'PCS';
  const remarks=selected('scanRemarks');
  if(op!=='stockOpname' && (!qty || qty<=0)){toast('Quantity harus lebih besar dari 0.',false);return;}
  if(!batch && op!=='stockOpname'){toast('Batch No wajib diisi.',false);return;}
  const base={username:user().Username||'admin',partId:lastScan.masterPartId,qty,uom,batchNo:batch,remarks};
  let action=SCAN_OPS[op]?.action; let data={...base};
  if(op==='receive'){data.referenceNo=selected('scanRef');}
  if(op==='transfer'){data.fromWarehouseId=selected('scanFromWh');data.toWarehouseId=selected('scanToWh');}
  if(op==='issue'){data.fromWarehouseId=selected('scanFromWh');}
  if(op==='subAssembly' || op==='finishProduct'){
    data.parentPartId=lastScan.masterPartId;
    data.outputBatchNo=selected('scanOutputBatch')||batch;
    const allowed = op==='subAssembly' ? (CACHE.productionParts?.subAssembly||[]) : (CACHE.productionParts?.finishedGood||[]);
    if(!allowed.some(x=>String(x.PartID)===String(lastScan.masterPartId))){
      throw new Error(op==='subAssembly'
        ? 'Scan ditolak: part bukan Sub Assembly atau tidak memiliki Active BOM.'
        : 'Scan ditolak: part bukan Finished Good atau tidak memiliki Active BOM.');
    }
  }
  if(op==='delivery'){data={username:user().Username||'admin',customerId:selected('scanCustomer'),vehicleNo:selected('scanVehicle'),driverName:selected('scanDriver'),remarks,details:[{partId:lastScan.masterPartId,batchNo:batch,qty,uom}]};}
  if(op==='stockOpname'){data={username:user().Username||'admin',warehouseId:selected('scanOpWh'),opnameDate:new Date().toISOString().slice(0,10),details:[{partId:lastScan.masterPartId,batchNo:batch,physicalQty:Number(selected('scanPhysical')||0),uom,remarks}]};}
  if(['receive','transfer','issue','subAssembly','finishProduct','materialNG','testingPass','testingNG'].includes(op)){

    if(op==='transfer' && (!data.fromWarehouseId||!data.toWarehouseId)){toast('From dan To Warehouse wajib dipilih.',false);return;}
    if(op==='issue' && !data.fromWarehouseId){toast('From Warehouse wajib dipilih.',false);return;}
  }
  if(op==='delivery' && (!data.customerId||!batch||qty<=0)){toast('Customer, Batch dan Qty wajib valid.',false);return;}
  if(op==='stockOpname' && !data.warehouseId){toast('Warehouse wajib dipilih.',false);return;}
  if(!action){toast('Operation tidak valid.',false);return;}
  const fp=transactionFingerprint(action,data);
  const now=Date.now();
  if(fp===lastSubmittedFingerprint && now-lastSubmittedAt<10000){toast('Transaksi yang sama baru saja dikirim. Double input diblokir.',false);return;}
  if(!confirm('Simpan transaksi '+(SCAN_OPS[op]?.label||op)+' untuk '+lastScan.partNumber+'?')) return;
  transactionBusy=true; lastSubmittedFingerprint=fp; lastSubmittedAt=now;
  const btn=document.querySelector('#scanOperation .scan-submit .primary');
  if(btn){btn.disabled=true;btn.textContent='PROCESSING...';}
  data.requestId=makeRequestId();
  try{
    const res=await apiPost(action,data);
    if(!res.success) throw new Error(res.message||'Transaksi gagal');
    toast(res.message||'Transaksi berhasil');
    clearScan();
    await refreshStockOnly();
    renderScanOperation();
  }catch(e){toast(e.message||'Transaksi gagal',false)}
  finally{
    transactionBusy=false;
    const b=document.querySelector('#scanOperation .scan-submit .primary');
    if(b){b.disabled=false;b.textContent='PROCESS TRANSACTION';}
  }
}

const IMPORT_CONFIG={
  stock:{title:'Beginning Stock',action:'importBeginningStockExcel',sheet:'BeginningStock',required:['OpeningNo','OpeningDate','PartNumber','Warehouse','BatchNo','Qty','UOM','Reason'],template:[['OpeningNo','OpeningDate','PartNumber','Warehouse','BatchNo','Qty','UOM','Reason'],['OB-001','2026-10-07','14544435-00','WH-L2','B001',500,'PCS','Initial Stock Migration']]},
  master:{title:'Master Part',action:'importMasterExcel',sheet:'MasterPart',required:['PartNumber','PartName','PartType','Category','UOM','MinStock','MaxStock','Status'],template:[['PartNumber','PartName','PartType','Category','UOM','MinStock','MaxStock','Status'],['14544435-00','Example Bracket','MATERIAL','ENGINE','PCS',100,500,'ACTIVE']]},
  bom:{title:'BOM + BOM Detail',action:'importBOMExcel',sheet:'BOM',required:['BOMNo','ParentPartNumber','BOMVersion','EffectiveDate','Status','ComponentPartNumber','QtyPer','UOM','ScrapPercent','Sequence'],template:[['BOMNo','ParentPartNumber','BOMVersion','EffectiveDate','Status','ComponentPartNumber','QtyPer','UOM','ScrapPercent','Sequence'],['BOM-001','ENGINE-A','V1','2026-10-07','ACTIVE','14544435-00',2,'PCS',0,10]]},
};
let _importRows=[];let _importType='master';let _importFileName='';
function importCenterPage(){
  shell('Import Center','Upload Excel untuk Master Part, BOM/BOM Detail, dan Beginning Stock',`
  <div class="import-tabs">

  </div>
  <div class="import-grid">
    <div class="panel">
      <h4 id="importTitle">Master Part</h4>

      <div class="import-actions">

  <div class="panel"><h4>Alur</h4><div class="import-flow"><span>Excel</span><b>→</b><span>Browser Preview</span><b>→</b><span>Backend Validation</span><b>→</b><span>Import</span><b>→</b><span>Database</span></div><small class="muted">Beginning Stock akan menjadi TransactionType = BEGINNING_STOCK dan memperbarui InventoryBalance melalui engine stock.</small></div>`);

function resetImportUI(){_importRows=[];_importFileName='';document.getElementById('excelFile').value='';document.getElementById('fileName').textContent='Belum ada file';document.getElementById('importTotal').textContent='0';document.getElementById('importValid').textContent='0';document.getElementById('importErrors').textContent='0';document.getElementById('importMessage').className='empty';document.getElementById('importMessage').textContent='Upload file lalu Preview.';document.getElementById('importPreview').innerHTML='<div class="empty">Belum ada data.</div>';document.getElementById('executeImportBtn').disabled=true;}
function updateImportInfo(){const c=IMPORT_CONFIG[_importType];document.getElementById('importTitle').textContent=c.title;document.getElementById('importRules').innerHTML='<b>Kolom:</b> '+c.required.map(esc).join(' · ');}
function normalizeHeader(x){return String(x??'').trim().replace(/\s+/g,'');}
function normalizeRows(rows){return rows.map(r=>{const o={};Object.keys(r).forEach(k=>o[normalizeHeader(k)]=r[k]);return o;}).filter(r=>Object.values(r).some(v=>String(v??'').trim()!==''));}
function handleExcelFile(e){const file=e.target.files?.[0];if(!file)return;_importFileName=file.name;document.getElementById('fileName').textContent=file.name;const reader=new FileReader();reader.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});const sheet=wb.Sheets[wb.SheetNames[0]];_importRows=normalizeRows(XLSX.utils.sheet_to_json(sheet,{defval:''}));document.getElementById('importTotal').textContent=_importRows.length;document.getElementById('importValid').textContent='0';document.getElementById('importErrors').textContent='0';document.getElementById('importMessage').textContent=`File terbaca: ${wb.SheetNames[0]} · ${_importRows.length} row`;document.getElementById('importMessage').className='system-ok';renderImportPreview(_importRows.slice(0,100),[]);document.getElementById('executeImportBtn').disabled=true;}catch(err){toast('Excel gagal dibaca: '+err.message,false);}};reader.readAsArrayBuffer(file);}
function localValidate(rows){const c=IMPORT_CONFIG[_importType],errors=[],seen={};rows.forEach((r,i)=>{const row=i+2;c.required.forEach(k=>{if(String(r[k]??'').trim()==='')errors.push({row,message:k+' wajib diisi'});});let key='';if(_importType==='master')key=String(r.PartNumber||'').trim().toUpperCase();if(_importType==='bom')key=String(r.BOMNo||'').trim().toUpperCase()+'|'+String(r.ComponentPartNumber||'').trim().toUpperCase();if(_importType==='stock')key=String(r.PartNumber||'').trim().toUpperCase()+'|'+String(r.Warehouse||'').trim().toUpperCase()+'|'+String(r.BatchNo||'').trim().toUpperCase();if(key){if(seen[key])errors.push({row,message:'Duplicate key di file: '+key});seen[key]=true;}if(_importType==='master'){const min=Number(r.MinStock||0),max=Number(r.MaxStock||0);if(Number.isNaN(min)||Number.isNaN(max))errors.push({row,message:'MinStock/MaxStock harus angka'});if(max>0&&min>max)errors.push({row,message:'MinStock > MaxStock'});}if(_importType==='bom'&&(Number(r.QtyPer)<=0||Number.isNaN(Number(r.QtyPer))))errors.push({row,message:'QtyPer harus > 0'});if(_importType==='stock'&&(Number(r.Qty)<=0||Number.isNaN(Number(r.Qty))))errors.push({row,message:'Qty harus > 0'});});return errors;}
function previewImport(){if(!_importRows.length){toast('Pilih file Excel terlebih dahulu.',false);return;}const errors=localValidate(_importRows);document.getElementById('importValid').textContent=Math.max(0,_importRows.length-errors.length);document.getElementById('importErrors').textContent=errors.length;document.getElementById('importMessage').textContent=errors.length?`Ditemukan ${errors.length} error format. Perbaiki Excel sebelum import.`:`Format dasar OK. ${_importRows.length} row siap divalidasi server.`;document.getElementById('importMessage').className=errors.length?'error':'system-ok';renderImportPreview(_importRows.slice(0,100),errors);document.getElementById('executeImportBtn').disabled=errors.length>0;}
function renderImportPreview(rows,errors){const c=IMPORT_CONFIG[_importType],errMap={};errors.forEach(e=>(errMap[e.row]=errMap[e.row]||[]).push(e.message));let h='<table class="data-table"><thead><tr><th>Row</th>'+c.required.map(x=>`<th>${esc(x)}</th>`).join('')+'<th>Validation</th></tr></thead><tbody>';rows.forEach((r,i)=>{const row=i+2,errs=errMap[row]||[];h+='<tr class="'+(errs.length?'row-error':'')+'"><td>'+row+'</td>'+c.required.map(k=>`<td>${esc(r[k]??'')}</td>`).join('')+'<td>'+esc(errs.join('; '))+'</td></tr>';});h+='</tbody></table>';document.getElementById('importPreview').innerHTML=h;}
async function executeImport(){if(!_importRows.length)return;const errors=localValidate(_importRows);if(errors.length){toast('Masih ada error format.',false);return;}const c=IMPORT_CONFIG[_importType];if(!confirm(`Import ${_importRows.length} row ${c.title}? Data akan ditulis ke database WMS.`))return;const btn=document.getElementById('executeImportBtn');btn.disabled=true;btn.textContent='IMPORTING...';try{const r=await apiPost(c.action,{rows:_importRows,username:user().Username||'admin',fileName:_importFileName,requestId:makeRequestId()});if(!r.success){let msg=r.message||'Import gagal';if(r.errors?.length)msg+='\n'+r.errors.slice(0,10).map(x=>'Row '+x.row+': '+x.message).join('\n');throw new Error(msg);}toast(r.message||'Import berhasil');await refreshAll();go('import-center');}catch(e){toast(e.message||'Import gagal',false);btn.disabled=false;btn.textContent='IMPORT / POST';}}
function downloadImportTemplate(){const c=IMPORT_CONFIG[_importType];const ws=XLSX.utils.aoa_to_sheet(c.template);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,c.sheet);XLSX.writeFile(wb,'WMS_'+c.sheet+'_Template.xlsx');}

let bomCount=0;function addBomItem(){bomCount++;document.getElementById('bomItems').insertAdjacentHTML('beforeend',`<div class="line-item" id="bi${bomCount}">${fs('Component','bc'+bomCount,sel('bc'+bomCount,parts()))}${f('Qty / Unit','bq'+bomCount,'number','min="0.000001" step="any"')}${f('Scrap %','bs'+bomCount,'number','min="0" step="any" value="0"')}<button class="remove" onclick="document.getElementById('bi${bomCount}').remove()">×</button></div>`)}async function saveBom(){const components=[...document.querySelectorAll('#bomItems .line-item')].map(row=>{const id=row.id.slice(2);return{componentPartId:v('bc'+id),qtyPer:Number(v('bq'+id)),uom:'PCS',scrapPercent:Number(v('bs'+id)||0)}});await submit('saveBOM',{parentPartId:v('bomParent'),bomVersion:v('bomVer'),effectiveDate:v('bomDate'),components},'BOM')}
async function submit(action,data,label){
  if(transactionBusy){toast('Transaksi sedang diproses. Double input diblokir.',false);return;}
  const fp=transactionFingerprint(action,data),now=Date.now();
  if(fp===lastSubmittedFingerprint && now-lastSubmittedAt<10000){toast('Transaksi yang sama baru saja dikirim. Double input diblokir.',false);return;}
  const active=document.querySelector('.nav-item.active')?.dataset.page||'dashboard';
  const btn=document.querySelector('#saveBtn,#saveDelivery,#saveOp,.process .primary:not([disabled])');
  transactionBusy=true;lastSubmittedFingerprint=fp;lastSubmittedAt=now;
  if(btn){btn.disabled=true;btn.dataset.oldText=btn.textContent;btn.textContent='PROCESSING...';}
  try{
    const r=await apiPost(action,{...data,username:user().Username||'admin',requestId:makeRequestId()});
    if(!r.success)throw Error(r.message||label+' gagal');
    toast(label+' berhasil');
    if(['receive','transfer','issue','subAssembly','finishProduct','materialNG','testingPass','testingNG','delivery','stockOpname'].includes(action)){await refreshStockOnly();go(active)}else{await refreshAll();go(active)}
  }catch(e){toast(e.message||label+' gagal',false)}
  finally{transactionBusy=false;if(btn){btn.disabled=false;btn.textContent=btn.dataset.oldText||'Save';}}
}

async function handleLogin(event){
  event.preventDefault();
  const msg=document.getElementById('loginMessage');
  const btn=document.querySelector('#loginForm button');
  msg.textContent='Memproses login...';
  btn.disabled=true;
  try{
    const username=document.getElementById('username').value.trim();
    const password=document.getElementById('password').value;
    const result=await loginUser(username,password);
    if(!result.success) throw new Error(result.message||'Login gagal.');
    sessionStorage.setItem('wmsUser',JSON.stringify(result.user));
    showApp(result.user);
    await loadCache();
    go('dashboard');
  }catch(e){msg.textContent=e.message||'Login gagal.';}
  finally{btn.disabled=false;}
}
