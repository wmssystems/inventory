<script>
const WMS_API_BASE = "https://script.google.com/macros/s/AKfycbwevovIh8eNMCyOdTPPmsElYCJXJPI1LCmtsFQnESYXpz5rheespn1LrUX3QFhsLdGGEQ/exec";
async function apiGet(action, params={}) {
  const q = new URLSearchParams({action, username:(user().Username||''), ...params});
  const r = await fetch(WMS_API_BASE + '?' + q.toString(), {method:'GET', credentials:'same-origin'});
  const text = await r.text();
  try { return JSON.parse(text); } catch(e) { throw new Error('Response API tidak valid: ' + text.slice(0,200)); }
}
async function apiPost(action, data={}) {
  const payload = {...data, action};
  const r = await fetch(WMS_API_BASE, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload), credentials:'same-origin'});
  const text = await r.text();
  try { return JSON.parse(text); } catch(e) { throw new Error('Response API tidak valid: ' + text.slice(0,300)); }
}
function makeRequestId(){return 'REQ-' + Date.now() + '-' + Math.random().toString(36).slice(2,10);}
function transactionFingerprint(action,data){return action+'|'+JSON.stringify(data);}
async function loginUser(username,password){return apiGet('login',{username,password});}
function logoutUser(){sessionStorage.removeItem('wmsUser');location.reload();}

const META={scan:['Scan / Operation','Full-screen QR / Barcode operation'],dashboard:['Dashboard','Inventory Control & Warehouse Overview'], 'master-part':['Master Part','MasterPart'],warehouse:['Warehouse','Warehouse & Location'],customer:['Customer','Customer Master'],bom:['BOM','Bill of Material'],receiving:['Receiving','Supplier → STG'],stock:['Stock','All Warehouse · Filter by Warehouse'], 'stock-summary':['Stock Summary','Material stock by item · WH-L2 + WH-IN'],transfer:['Transfer','Warehouse Movement'],issue:['Issue Material','Warehouse → PROD'],production:['Production','Sub Assembly & Finish Product'],testing:['Testing / QC','PASS → FG | NG → HOLD'],'material-ng':['Material NG','PROD → MAT-NG'],hold:['Product Hold','TEST → HOLD'],delivery:['FG Delivery','FG → Customer'],'stock-opname':['Stock Opname','Physical Stock Validation'],'stock-opname-report':['Report Stock Opname','Opname result, system vs physical, and discrepancy'],'delivery-summary':['Summary Delivery','Delivery summary by date, customer, and finished good'],'stock-card':['Stock Card','Pergerakan stock per Part + Warehouse + Batch'],'transaction-summary':['Summary Transaction','Summary and export all WMS transactions'],'transaction-revision':['Revisi Transaction','ADMIN only · reversal transaction with stock rollback'],transactions:['Transactions','Traceability']};

function partGroups(){return [...new Set((CACHE.parts||[]).filter(x=>String(x.PartType||'').trim().toUpperCase().replace(/[-\s]+/g,'_')==='MATERIAL').map(x=>normalizePartGroup(x.PartGroup)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));}
function parts(){return CACHE.parts.map(x=>({id:x.PartID,label:`${x.PartNumber} — ${x.PartName||''}${x.PartGroup?` [${x.PartGroup}]`:''}`}));}
function materialParts(group=''){const g=normalizePartGroup(group).toUpperCase();return CACHE.parts.filter(x=>{const t=String(x.PartType||'').trim().toUpperCase().replace(/[-\s]+/g,'_');return t==='MATERIAL' && (!g||normalizePartGroup(x.PartGroup).toUpperCase()===g);}).map(x=>({id:x.PartID,label:`${x.PartNumber} — ${x.PartName||''}${x.PartGroup?` [${x.PartGroup}]`:''}`}));}
function bindMaterialGroupFilter(groupId,partId){const ge=document.getElementById(groupId),pe=document.getElementById(partId);if(!ge||!pe)return;const rebuild=()=>{const current=pe.value;pe.innerHTML='<option value="">Pilih Part Number</option>'+materialParts(ge.value).map(x=>`<option value="${esc(x.id)}">${esc(x.label)}</option>`).join('');if([...pe.options].some(o=>o.value===current))pe.value=current;};ge.onchange=rebuild;rebuild();}
function productionParts(kind){
  const list = CACHE.productionParts?.[kind] || [];
  return list.map(x=>({id:x.PartID,label:`${x.PartNumber} — ${x.PartName||''}`}));
}function whs(){return CACHE.warehouses.map(x=>({id:x.WarehouseID,label:`${x.WarehouseCode} — ${x.WarehouseName}`}));}function custs(){return CACHE.customers.map(x=>({id:x.CustomerID,label:`${x.CustomerCode} — ${x.CustomerName}`}));}
function formCard(fields,submitText='Save'){return `<div class="form-card"><div class="form-grid">${fields.join('')}</div><div class="form-actions"><button class="btn ghost" onclick="go(document.querySelector('.nav-item.active')?.dataset.page||'dashboard')">Cancel</button><button class="btn primary" id="saveBtn">${submitText}</button></div></div>`}
function txLayout(config){return `<div class="tx-page"><div class="tx-main">${config.main}</div><aside class="tx-side"><div class="panel"><h4>Process Flow</h4><div class="tx-flow">${config.flow||''}</div></div><div class="panel"><h4>Transaction Status</h4><div class="status-list"><div><span>Operator</span><b>${esc(user().FullName||user().Username||'-')}</b></div><div><span>Role</span><b>${esc(String(user().Role||'').toUpperCase())}</b></div><div><span>API</span><b class="system-ok">● Connected</b></div></div></div>${config.side||''}</aside></div>`}
function f(label,id,type='text',extra=''){return `<label class="field"><span>${label}</span><input id="${id}" type="${type}" ${extra}></label>`}function fs(label,id,html){return `<label class="field"><span>${label}</span>${html}</label>`}
async function dashboard(){
  shell('Dashboard','Inventory Control & Warehouse Overview',`
    <div class="dash-hero">
      <div>
        <span class="dash-eyebrow">LIVE WMS MONITORING</span>
        <h3>Warehouse Operations Dashboard</h3>
        <p></p>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="dash-date" id="dashDate">Today</div>
        <button class="btn ghost" id="dashboardFullscreenBtn" type="button" style="background:rgba(255,255,255,.10);color:#fff;border-color:rgba(255,255,255,.20)">⛶ Full Screen</button>
      </div>
    </div>
    <button id="dashboardExitBtn" class="dashboard-exit" type="button">✕ Exit Full Screen</button>

    <div class="kpis kpis-main dashboard-kpis-compact">
      <div class="kpi k-stock"><span>FG STOCK — W08</span><b id="kFgStock">-</b><small></small></div>
      <div class="kpi k-delivery"><span>DELIVERY THIS MONTH</span><b id="kMonthDelivery">-</b><small id="kMonthDeliverySub">Current month</small></div>
      <div class="kpi k-inbound"><span>INBOUND TODAY</span><b id="k1">-</b><small>Receiving today</small></div>
      <div class="kpi k-ng"><span>LOW STOCK ITEMS</span><b id="kLowStock">-</b><small></small></div>
    </div>

    <div class="dashboard-grid dashboard-grid-main">
      <div class="panel dashboard-panel-fg">
        <div class="panel-head"><h4>Summary Finish Good</h4><span class="panel-note"></span></div>
        <div id="fgSummary" class="dashboard-fg-summary compact" style="margin-top:10px"></div>
      </div>

      <div class="panel dashboard-panel-chart">
        <div class="panel-head"><h4>Real Stock — 7 Days</h4><span class="panel-note">Daily stock snapshot</span></div>
        <div id="fgWeekChart" class="dashboard-fg-chart compact-chart"></div>
        <div id="fgWeekTotal" class="fg-total"></div>
      </div>

      <div class="panel dashboard-panel-delivery">
        <div class="panel-head"><h4>Summary Delivery — 1 Month</h4><span id="deliveryMonthLabel" class="panel-note">Current month</span></div>
        <div id="monthlyDeliveryKpi" class="monthly-delivery-kpi"></div>
        <div id="monthlyDeliveryTable" class="dashboard-table-wrap compact-table" style="margin-top:8px"></div>
      </div>

      <div class="panel dashboard-panel-low">
        <div class="panel-head"><h4>Material Below Stock Minimum</h4><span class="panel-note">WH-L2 + WH-INV</span></div>
        <div id="lowMaterial" class="dashboard-table-wrap compact-table" style="margin-top:8px"></div>
      </div>
    </div>
    <div class="dashboard-status"><span class="system-ok">● API Connected</span><small id="statusDetail">Loading...</small></div>`);

  const enterDashboardFullscreen=async()=>{
    try{
      if(!document.fullscreenElement){await document.documentElement.requestFullscreen();}
      document.body.classList.add('dashboard-display-mode');
    }catch(e){
      document.body.classList.add('dashboard-display-mode');
      toast('Mode dashboard layar penuh aktif. Browser menolak Fullscreen API, tekan F11 jika diperlukan.',false);
    }
  };
  const exitDashboardFullscreen=async()=>{
    document.body.classList.remove('dashboard-display-mode');
    if(document.fullscreenElement){try{await document.exitFullscreen();}catch(e){}}
  };
  document.getElementById('dashboardFullscreenBtn').onclick=enterDashboardFullscreen;
  document.getElementById('dashboardExitBtn').onclick=exitDashboardFullscreen;
  document.addEventListener('fullscreenchange',()=>{
    if(document.fullscreenElement && document.querySelector('.nav-item.active')?.dataset.page==='dashboard') document.body.classList.add('dashboard-display-mode');
    else if(!document.fullscreenElement) document.body.classList.remove('dashboard-display-mode');
  },{once:false});

  try{
    const histFrom=new Date(); histFrom.setDate(histFrom.getDate()-6);
    const histTo=new Date();
    const isoDay=d0=>{const y=d0.getFullYear(),m=String(d0.getMonth()+1).padStart(2,'0'),dd=String(d0.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`};
    const [d,t,hRes,dRes,historyRes]=await Promise.all([
      apiGet('dashboard'),
      apiGet('transactions',{limit:5000}),
      apiGet('deliveries'),
      apiGet('deliveryDetails'),
      apiGet('stockHistory',{fromDate:isoDay(histFrom),toDate:isoDay(histTo)}).catch(e=>({success:false,data:[],message:e.message||'Stock History API belum tersedia'}))
    ]);
    if(!d.success) throw Error(d.message);
    if(!hRes.success) throw Error(hRes.message||'Delivery header gagal dimuat.');
    if(!dRes.success) throw Error(dRes.message||'Delivery detail gagal dimuat.');
    // Stock History is an ADD-ON. If the deployed backend is still the previous version,
    // keep the existing dashboard fully usable and use live InventoryBalance for today.
    // Historical bars remain 0 until the StockHistory module is deployed.
    const x=d.data||{};

    const wm={};CACHE.warehouses.forEach(w=>wm[String(w.WarehouseID)]=w);
    const pm={};CACHE.parts.forEach(p=>pm[String(p.PartID)]=p);
    const txs=(t.data||[]).filter(z=>String(z.Status||'').toUpperCase()!=='REVERSED');

    const fgWh=CACHE.warehouses.find(w=>{
      const c=String(w.WarehouseCode||'').trim().toUpperCase();
      const id=String(w.WarehouseID||'').trim().toUpperCase();
      return c==='W08'||id==='WH008'||c==='FG';
    });
    const fgType=p=>{const v=String(p?.PartType||'').trim().toUpperCase().replace(/[-\s]+/g,'_');return ['FINISHED_GOOD','FINISH_GOOD','FINISHEDGOODS','FINISHED_PRODUCT','FINISH_PRODUCT','FG'].includes(v)};
    const material=p=>String(p?.PartType||'').trim().toUpperCase().replace(/[-\s]+/g,'_')==='MATERIAL';

    // ===== FG STOCK W08: aggregate by item, never by batch =====
    const fgSummary={};
    if(fgWh){
      CACHE.stock.filter(s=>String(s.WarehouseID)===String(fgWh.WarehouseID)).forEach(s=>{
        const p=pm[String(s.PartID)]; if(!fgType(p)) return;
        const id=String(s.PartID); fgSummary[id]=(fgSummary[id]||0)+Number(s.QtyOnHand||0);
      });
    }
    const fgRows=Object.entries(fgSummary).sort((a,b)=>b[1]-a[1]);
    const fgTotal=fgRows.reduce((a,[,q])=>a+q,0);
    document.getElementById('kFgStock').textContent=fmt(fgTotal);
    document.getElementById('fgSummary').innerHTML=fgRows.length
      ? fgRows.map(([id,q])=>`<div class="fg-summary-row"><div><b>${esc(pm[id]?.PartNumber||id)}</b><small>${esc(pm[id]?.PartName||'')}</small></div><strong>${fmt(q)}</strong><span>${esc(pm[id]?.UOM||'PCS')}</span></div>`).join('')
      : '<div class="dashboard-empty">Belum ada stock Finish Good di W08.</div>';

    // ===== REAL STOCK HISTORY: last 7 calendar days =====
    // Dashboard requirement: show ALL Finish Good items physically in W08/TEST,
    // one stacked segment per item, while BATCH is intentionally excluded.
    // Historical data comes from StockHistory; today's data is live InventoryBalance.
    const now=new Date(); now.setHours(0,0,0,0);
    const days=[]; for(let i=6;i>=0;i--){const d0=new Date(now);d0.setDate(now.getDate()-i);days.push(d0);}
    const dayKey=d0=>{const y=d0.getFullYear(),m=String(d0.getMonth()+1).padStart(2,'0'),dd=String(d0.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`;};
    const todayKey=dayKey(now);
    const testWh=CACHE.warehouses.find(w=>{
      const c=String(w.WarehouseCode||'').trim().toUpperCase();
      const id=String(w.WarehouseID||'').trim().toUpperCase();
      return c==='W08'||id==='WH008'||c==='TEST';
    });
    const fgHistoryRows={};
    const itemMeta={};
    const isTestRow=row=>{
      if(!testWh) return false;
      const wid=String(row.WarehouseID||'').trim().toUpperCase();
      const wc=String(row.WarehouseCode||'').trim().toUpperCase();
      return wid===String(testWh.WarehouseID||'').trim().toUpperCase() || wc==='W08' || wc==='TEST';
    };
    const addHistoryRow=(date,row)=>{
      if(!date || !isTestRow(row)) return;
      const p=pm[String(row.PartID||'')]||{};
      if(!fgType(p)) return;
      const partId=String(row.PartID||'').trim(); if(!partId) return;
      itemMeta[partId]=p;
      if(!fgHistoryRows[date]) fgHistoryRows[date]={};
      fgHistoryRows[date][partId]=(fgHistoryRows[date][partId]||0)+Number(row.QtyOnHand||0);
    };
    // History API contains all items/warehouses; filter to W08 + Finish Good only.
    (historyRes.data||[]).forEach(row=>addHistoryRow(String(row.HistoryDate||'').slice(0,10),row));
    // Today must be live and must replace today's snapshot so the chart reflects current W08.
    fgHistoryRows[todayKey]={};
    if(testWh){
      CACHE.stock.filter(s=>String(s.WarehouseID)===String(testWh.WarehouseID)).forEach(s=>addHistoryRow(todayKey,s));
    }
    // Build the full item set across all 7 days, not just today's items.
    const itemIds=new Set();
    days.forEach(d0=>Object.keys(fgHistoryRows[dayKey(d0)]||{}).forEach(id=>itemIds.add(id)));
    const items=[...itemIds].map(id=>({id,p:itemMeta[id]||pm[id]||{}})).sort((a,b)=>String(a.p.PartNumber||a.id).localeCompare(String(b.p.PartNumber||b.id)));
    const palette=['#67b7e8','#3d86d4','#f07f22','#ffd45b','#7b61a8','#43a97d','#d85c6d','#6c8aa3','#9b7a52','#4d5bd5','#e5a84b','#58a6a6'];
    const maxTotal=Math.max(1,...days.map(d0=>Object.values(fgHistoryRows[dayKey(d0)]||{}).reduce((a,q)=>a+Number(q||0),0)));
    const legend=items.map((x,i)=>`<span class="fg-history-legend-item" title="${esc(x.p.PartName||x.p.PartNumber||x.id)}"><i style="background:${palette[i%palette.length]}"></i><span>${esc(x.p.PartNumber||x.id)}</span></span>`).join('');
    const bars=days.map(d0=>{
      const k=dayKey(d0), rows=fgHistoryRows[k]||{};
      const total=items.reduce((sum,x)=>sum+Number(rows[x.id]||0),0);
      const segments=items.map((x,i)=>{
        const q=Number(rows[x.id]||0); if(q<=0)return '';
        const h=(q/maxTotal)*100;
        return `<div class="fg-segment" style="height:${h}%;background:${palette[i%palette.length]}" title="${esc(x.p.PartNumber||x.id)}: ${fmt(q)}"></div>`;
      }).join('');
      const live=k===todayKey?' · LIVE':'';
      return `<div class="fg-day"><b>${fmt(total)}</b><div class="fg-bar-track"><div class="fg-stack">${segments}</div></div><span>${d0.toLocaleDateString('id-ID',{day:'2-digit',month:'short'})}${live}</span></div>`;
    }).join('');
    document.getElementById('fgWeekChart').innerHTML=items.length
      ? `<div class="fg-history-wrap"><div class="fg-history-legend">${legend}</div><div class="fg-history-bars">${bars}</div></div>`
      : '<div class="fg-history-empty">Belum ada Finish Good di W08 / TEST pada periode 7 hari.</div>';
    const todayTotal=Object.values(fgHistoryRows[todayKey]||{}).reduce((a,q)=>a+Number(q||0),0);
    const historicalTotals=days.map(d0=>Object.values(fgHistoryRows[dayKey(d0)]||{}).reduce((a,q)=>a+Number(q||0),0));
    const minStock=Math.min(...historicalTotals), maxStock=Math.max(...historicalTotals);
    document.getElementById('fgWeekTotal').textContent=`All FG items · Batch excluded · Min ${fmt(minStock)} · Max ${fmt(maxStock)} · W08/TEST today ${fmt(todayTotal)}`;
    const note=document.querySelector('.dashboard-panel-chart .panel-note');
    if(note) note.textContent='W08 / TEST · All FG items · Batch excluded';


    // ===== MATERIAL LOW STOCK: WH-L2 + WH-INV compared with MasterPart.MinStock =====
    const targetWh=CACHE.warehouses.filter(w=>{const c=String(w.WarehouseCode||'').trim().toUpperCase(),id=String(w.WarehouseID||'').trim().toUpperCase();return c==='WH-L2'||c==='WH-INV'||id==='WH002'||id==='WH003';});
    const targetIds=new Set(targetWh.map(w=>String(w.WarehouseID))); const mat={};
    CACHE.stock.filter(s=>targetIds.has(String(s.WarehouseID))).forEach(s=>{
      const p=pm[String(s.PartID)]; if(!material(p)) return; const id=String(s.PartID); if(!mat[id])mat[id]={l2:0,inv:0};
      const code=String(wm[String(s.WarehouseID)]?.WarehouseCode||'').toUpperCase();
      if(code==='WH-L2'||String(s.WarehouseID).toUpperCase()==='WH002')mat[id].l2+=Number(s.QtyOnHand||0);
      else if(code==='WH-INV'||String(s.WarehouseID).toUpperCase()==='WH003')mat[id].inv+=Number(s.QtyOnHand||0);
    });
    const low=Object.entries(mat).map(([id,v])=>{const p=pm[id]||{},min=Number(p.MinStock||0),total=v.l2+v.inv;return{id,p,v,min,total,gap:min-total};}).filter(x=>x.min>0&&x.total<x.min).sort((a,b)=>b.gap-a.gap);
    document.getElementById('kLowStock').textContent=fmt(low.length);
    document.getElementById('lowMaterial').innerHTML=low.length
      ? `<table class="low-stock-table"><thead><tr><th>Part</th><th>WH-L2</th><th>WH-INV</th><th>Total</th><th>Min</th><th>Short</th></tr></thead><tbody>${low.slice(0,8).map(x=>`<tr><td><b>${esc(x.p.PartNumber||x.id)}</b><small>${esc(x.p.PartName||'')}</small></td><td>${fmt(x.v.l2)}</td><td>${fmt(x.v.inv)}</td><td><b>${fmt(x.total)}</b></td><td>${fmt(x.min)}</td><td class="low-stock-critical">-${fmt(x.gap)}</td></tr>`).join('')}</tbody></table>${low.length>8?`<div class="compact-note">+ ${fmt(low.length-8)} item lainnya di bawah minimum</div>`:''}`
      : '<div class="dashboard-empty">Tidak ada material di bawah stock minimum pada WH-L2 + WH-INV.</div>';

    // ===== DELIVERY SUMMARY: current calendar month =====
    const headers=hRes.data||[],details=dRes.data||[];
    const headMap=Object.fromEntries(headers.map(h=>[String(h.DeliveryID||''),h]));
    const currentMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    const monthName=now.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
    const deliveryRows=details.map(d=>{const h=headMap[String(d.DeliveryID||'')]||{},p=pm[String(d.PartID)]||{};const date=reportDateValue_(h.DeliveryDate);return{DeliveryNo:h.DeliveryNo||'',DeliveryDate:date,PartNumber:p.PartNumber||d.PartID||'',PartName:p.PartName||'',Qty:Number(d.Qty||0),UOM:d.UOM||p.UOM||'PCS',CustomerID:h.CustomerID||'',Status:String(h.Status||'').toUpperCase()};}).filter(r=>r.DeliveryDate&&r.DeliveryDate.slice(0,7)===currentMonth);
    const monthQty=deliveryRows.reduce((a,r)=>a+r.Qty,0), monthDocs=new Set(deliveryRows.map(r=>r.DeliveryNo).filter(Boolean)).size, monthParts=new Set(deliveryRows.map(r=>r.PartNumber).filter(Boolean)).size;
    document.getElementById('kMonthDelivery').textContent=fmt(monthQty);
    document.getElementById('kMonthDeliverySub').textContent=`${monthDocs} delivery · ${monthName}`;
    document.getElementById('deliveryMonthLabel').textContent=monthName;
    const byPart={};deliveryRows.forEach(r=>{const k=r.PartNumber||'-';if(!byPart[k])byPart[k]={part:r.PartNumber||'-',name:r.PartName||'',qty:0,uom:r.UOM||'PCS',docs:new Set()};byPart[k].qty+=r.Qty;if(r.DeliveryNo)byPart[k].docs.add(r.DeliveryNo);});
    const deliveryItems=Object.values(byPart).sort((a,b)=>b.qty-a.qty);
    document.getElementById('monthlyDeliveryKpi').innerHTML=`<div><span>DELIVERY</span><b>${fmt(monthDocs)}</b></div><div><span>QTY</span><b>${fmt(monthQty)}</b></div><div><span>FG ITEMS</span><b>${fmt(monthParts)}</b></div>`;
    document.getElementById('monthlyDeliveryTable').innerHTML=deliveryItems.length
      ? `<table class="low-stock-table"><thead><tr><th>FG Part</th><th>Part Name</th><th>Qty</th><th>DO</th></tr></thead><tbody>${deliveryItems.slice(0,6).map(r=>`<tr><td><b>${esc(r.part)}</b></td><td>${esc(r.name)}</td><td><b>${fmt(r.qty)}</b> ${esc(r.uom)}</td><td>${fmt(r.docs.size)}</td></tr>`).join('')}</tbody></table>${deliveryItems.length>6?`<div class="compact-note">+ ${fmt(deliveryItems.length-6)} FG item lainnya</div>`:''}`
      : '<div class="dashboard-empty">Belum ada delivery pada bulan berjalan.</div>';

    document.getElementById('k1').textContent=fmt(x.inboundToday);
    document.getElementById('dashDate').textContent=x.dashboardDate||'Today';
    document.getElementById('statusDetail').textContent=`${CACHE.stock.length} balance lines · ${txs.length} transactions loaded · FG source ${fgWh?.WarehouseCode||'W08'} · Delivery ${monthName}`;
    document.getElementById('apiState').textContent='● API Connected';
    document.getElementById('apiState').className='api-state good';
  }catch(e){
    document.getElementById('statusDetail').textContent=e.message;
    document.getElementById('apiState').textContent='● API Error';
    document.getElementById('apiState').className='api-state bad';
  }
}

async function stockPage(){
  shell('Stock','',`
    <div class="panel">
      <div class="stock-filter-bar">
        <div class="field"><span>Warehouse</span>${sel('stockWarehouseFilter',whs(),'Semua Warehouse')}</div>
        <div class="field"><span>Part Group</span><select id="stockPartGroupFilter"><option value="">All Part Group</option></select></div>
        <div class="field"><span>Search</span><input id="stockSearch" placeholder="Part Number / Part Name / Batch"></div>
        <div class="stock-filter-actions"><button class="btn ghost" id="stockRefreshBtn">↻ Refresh</button><button class="btn primary" id="stockDownloadBtn">↓ Download Excel</button></div>

      <div class="stock-summary-note" style="margin-top:10px"></div>
    </div>

      <div class="stock-filter-kpi"><span>WAREHOUSE</span><b id="stockKpiWh">-</b><small>Filter aktif</small></div>

      <div class="stock-filter-kpi"><span>QTY ON HAND</span><b id="stockKpiQty">-</b><small>Stock tersedia di lokasi</small></div>
      <div class="stock-filter-kpi"><span>BATCH</span><b id="stockKpiBatch">-</b><small>Batch aktif</small></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><b id="stockTableTitle">All Warehouse Stock</b><div class="stock-summary-note"></div></div></div>
      <div class="table-scroll" style="max-height:62vh;margin-top:14px"><table class="data-table"><thead><tr><th>No</th><th>Part Number</th><th>Part Name</th><th>Part Group</th><th>Category</th><th>Warehouse</th><th>Batch</th><th>UOM</th><th>Qty On Hand</th><th>Available</th></tr></thead><tbody id="stockRows"><tr><td colspan="10" class="empty">Loading...</td></tr></tbody></table></div>
    </div>`);

  const partMap={}; CACHE.parts.forEach(p=>partMap[String(p.PartID)]=p);
  const whMap={}; CACHE.warehouses.forEach(w=>whMap[String(w.WarehouseID)]=w);
  const allRows=(CACHE.stock||[]).map(s=>{
    const p=partMap[String(s.PartID)]||{}; const w=whMap[String(s.WarehouseID)]||{};
    return {...s,PartNumber:p.PartNumber||s.PartID||'',PartName:p.PartName||'',PartGroup:p.PartGroup||'',Category:p.Category||'',WarehouseCode:w.WarehouseCode||s.WarehouseID||'',WarehouseName:w.WarehouseName||'',WarehouseLabel:(w.WarehouseCode?`${w.WarehouseCode} — ${w.WarehouseName||''}`:s.WarehouseID||'')};
  }).filter(x=>Number(x.QtyOnHand||0)!==0 || Number(x.QtyAvailable||0)!==0);

  const render=()=>{
    const wh=String(document.getElementById('stockWarehouseFilter')?.value||'');
    const pg=String(document.getElementById('stockPartGroupFilter')?.value||'').trim().toLowerCase();
    const q=String(document.getElementById('stockSearch')?.value||'').trim().toLowerCase();
    const rows=allRows.filter(x=>(!wh||String(x.WarehouseID)===wh)&&(!pg||String(x.PartGroup||'').toLowerCase()===pg)&&[x.PartNumber,x.PartName,x.Category,x.WarehouseCode,x.WarehouseName,x.BatchNo].some(v=>String(v||'').toLowerCase().includes(q)));
    const whLabel=wh?(whMap[wh]?.WarehouseCode||wh):'ALL';

function applyScanToTransaction(prefix,op,r){

  const batchTargets={receive:'batchNo',transfer:'batchNo',issue:'batchNo',subAssembly:'saBatch',finishProduct:'fpBatch',testingPass:'tpBatch',testingNG:'tnBatch',materialNG:'ngBatch',delivery:'diBatch1'};
  const uomTargets={receive:'uom',transfer:'uom',issue:'uom'};
  const partId=partTargets[op];
  if(partId && !setSelectValue(partId,r.masterPartId)){setScanStatus(prefix,'Part ditemukan di parser tetapi belum tersedia pada daftar Part di form.',false);return false;}
  if(qtyTargets[op] && r.qty!==null) setInputValue(qtyTargets[op],r.qty);
  if(batchTargets[op] && r.batchNo) setInputValue(batchTargets[op],r.batchNo);
  if(uomTargets[op]) setInputValue(uomTargets[op],r.uom||r.masterUom||'PCS');

}
function setScanStatus(prefix,msg,ok=true){const el=document.getElementById(prefix+'ScanStatus');if(el){el.textContent=msg;el.className='inline-scan-status '+(ok?'ok':'err');}}
function parseWmsQR(raw){
  const original=String(raw??'').trim();
  if(!original) throw new Error('QR/barcode kosong.');

  const base={raw:original,partNumber:'',partName:'',uom:'PCS',qty:null,batchNo:'',lot:'',po:'',date:'',dn:'',serial:'',serialNumber:'',vendor:'',plant:'',expiryDate:'',qRaw:'',fields:{},masterPartId:null,masterUom:'PCS',masterFound:false};
  let part='', qty=null, batch='', uom='PCS', fields={};

  // JSON QR: {partNumber, qty, batchNo, uom, ...}
  if((original.startsWith('{')&&original.endsWith('}')) || (original.startsWith('[')&&original.endsWith(']'))){
    try{
      const obj=JSON.parse(original);
      const o=Array.isArray(obj)?(obj[0]||{}):obj;
      fields=o;
      part=o.partNumber||o.PartNumber||o.part||o.Part||o.M||'';
      qty=o.qty??o.Qty??o.quantity??o.Quantity??null;
      batch=o.batchNo||o.BatchNo||o.batch||o.Batch||o.B||'';
      uom=o.uom||o.UOM||o.unit||o.Unit||'PCS';
    }catch(e){ /* fall through to text formats */ }
  }

  // Internal WMS format: PART|QTY|BATCH, optionally PART|QTY|BATCH|UOM
  if(!part && original.includes('|')){
    const p=original.split('|').map(x=>x.trim());
    if(p.length>=1) part=p[0]||'';
    if(p.length>=2 && p[1]!=='' && !isNaN(Number(p[1]))) qty=Number(p[1]);
    if(p.length>=3) batch=p[2]||'';
    if(p.length>=4 && p[3]) uom=p[3];
  }

  // Supplier key/value format, e.g. M:14313141-00/PCS;Q:24/3/47;B:2605124CWW;Lot:20260512;PO:...
  if(!part && (/[A-Za-z][A-Za-z0-9 _-]*\s*:/).test(original)){
    const tokens=original.replace(/[\r\n]+/g,';').split(';').map(x=>x.trim()).filter(Boolean);
    for(const token of tokens){
      const m=token.match(/^([^:]+)\s*:\s*(.*)$/);
      if(!m) continue;
      const key=m[1].trim().toUpperCase().replace(/[\s_-]+/g,'');
      const value=m[2].trim();
      fields[key]=value;
      if(['M','PART','PARTNUMBER','PN','ITEM','MATERIAL'].includes(key)){
        const mm=value.match(/^(.+?)(?:\s*\/\s*([A-Za-z0-9._-]+))?$/);
        part=(mm?.[1]||value).trim();
        if(mm?.[2]) uom=mm[2].trim();
      }else if(['Q','QTY','QUANTITY'].includes(key)){
        base.qRaw=value;
        // Supplier Q may contain multiple slash-separated values, e.g. Q:48/8/12.
        // WMS quantity is the first numeric value: 48.
        const qMatch=value.match(/^\s*([-+]?\d+(?:\.\d+)?)(?:\s*\/.*)?$/);
        if(qMatch) qty=Number(qMatch[1]);
      }else if(['B','BATCH','BATCHNO','BATCHNUMBER'].includes(key)) batch=value;
      else if(key==='LOT') base.lot=value;
      else if(['PO','PONO','PURCHASEORDER'].includes(key)) base.po=value;
      else if(['DN','DELIVERYNOTE','DELIVERYNOTENO'].includes(key)) base.dn=value;
      else if(['V','VENDOR','SUPPLIER'].includes(key)) base.vendor=value;
      else if(['P','PLANT'].includes(key)) base.plant=value;
      else if(['D','DATE','MFGDATE','MANUFACTURINGDATE'].includes(key)) base.date=value;
      else if(['YX','EXP','EXPIRY','EXPIRYDATE'].includes(key)) base.expiryDate=value;
      else if(key==='S') base.serial=value;
      else if(['SN','SERIALNUMBER'].includes(key)) base.serialNumber=value;
    }
  }

  // Plain barcode/part number fallback. This is intentionally allowed; qty/batch remain empty for manual completion.
  if(!part) part=original;

  part=String(part).trim();
  if(!part) throw new Error('Part Number tidak ditemukan dari QR.');

  // Resolve the business key against MasterPart. PartType filtering is enforced by the transaction layer.
  const master=(Array.isArray(CACHE?.parts)?CACHE.parts:[]).find(x=>String(x.PartNumber||'').trim().toUpperCase()===part.toUpperCase());
  if(master){
    base.partNumber=master.PartNumber||part;
    base.partName=master.PartName||'';
    base.masterPartId=master.PartID||null;
    base.masterUom=master.UOM||'PCS';
    base.masterFound=true;
    if(!uom || uom==='PCS') uom=master.UOM||uom||'PCS';
  }else{
    base.partNumber=part;
  }

  base.qty=(qty===null||qty===''||typeof qty==='undefined')?null:Number(qty);
  if(Number.isNaN(base.qty)) base.qty=null;
  base.batchNo=String(batch||'').trim();
  base.uom=String(uom||base.masterUom||'PCS').trim()||'PCS';
  base.fields=fields;
  return base;
}

function handleInlineScan(prefix,op,raw){if(!raw)return;try{const r=parseWmsQR(raw);window._inlineScans=window._inlineScans||{};window._inlineScans[prefix]=r;const ok=applyScanToTransaction(prefix,op,r);if(ok)toast('Scan berhasil: '+r.partNumber+(r.qty!==null?' | Qty '+r.qty:''));}catch(e){setScanStatus(prefix,e.message||'Format QR tidak valid.',false);toast(e.message||'Format QR tidak valid.',false)}}
function lookupInlinePart(prefix,op){const pn=String(document.getElementById(prefix+'ManualPart')?.value||'').trim();if(!pn){toast('Masukkan Part Number.',false);return;}const master=CACHE.parts.find(x=>String(x.PartNumber||'').trim().toUpperCase()===pn.toUpperCase());if(!master){setScanStatus(prefix,'Part Number tidak ditemukan di MasterPart: '+pn,false);toast('Part Number tidak ditemukan di MasterPart.',false);return;}if(['receive','transfer','issue'].includes(op)){const mt=String(master.PartType||'').trim().toUpperCase().replace(/[-\s]+/g,'_');if(mt!=='MATERIAL'){setScanStatus(prefix,'Hanya MATERIAL yang boleh digunakan untuk Receiving / Transfer / Issue.',false);toast('Part bukan MATERIAL.',false);return;}}const r={raw:'MANUAL:'+pn,partNumber:master.PartNumber||pn,partName:master.PartName||'',uom:master.UOM||'PCS',qty:null,batchNo:'',lot:'',po:'',date:'',dn:'',serial:'',serialNumber:'',vendor:'',plant:'',expiryDate:'',qRaw:'',fields:{},masterPartId:master.PartID,masterUom:master.UOM||'PCS',masterFound:true,manual:true};window._inlineScans=window._inlineScans||{};window._inlineScans[prefix]=r;applyScanToTransaction(prefix,op,r);toast('Part ditemukan: '+r.partNumber);}
let inlineScanner=null;
async function startInlineCamera(prefix,op){
  if(!window.Html5Qrcode){toast('Library kamera belum tersedia.',false);return;}
  await stopInlineCamera();
  const readerId='qrReader-'+prefix;
  const el=document.getElementById(readerId);
  const scannerBox=document.getElementById('scanner-'+prefix);
  if(!el||!scannerBox)return;
  inlineScanner=new Html5Qrcode(readerId);
  scannerBox.classList.add('inline-camera-fullscreen');
  try{
    await inlineScanner.start(
      {facingMode:{exact:'environment'}},
      {fps:12,qrbox:(vw,vh)=>{const w=Math.min(Math.floor(vw*.82),420);const h=Math.min(Math.floor(vh*.48),260);return {width:w,height:h};},aspectRatio:1.7777778},
      txt=>{handleInlineScan(prefix,op,txt);stopInlineCamera();}
    );
    try{if(!document.fullscreenElement && scannerBox.requestFullscreen) await scannerBox.requestFullscreen();}catch(e){}
    setScanStatus(prefix,'Kamera aktif. Arahkan QR ke kotak scan.',true);
  }catch(e){
    inlineScanner=null;
    scannerBox.classList.remove('inline-camera-fullscreen');
    toast('Kamera tidak dapat dibuka: '+e,false);
  }
}
async function stopInlineCamera(){
  const box=document.querySelector('.inline-camera-fullscreen');
  try{if(inlineScanner){await inlineScanner.stop();await inlineScanner.clear();}}catch(e){}
  inlineScanner=null;
  if(box)box.classList.remove('inline-camera-fullscreen');
  try{if(document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();}catch(e){}
}

let transactionBusy=false;
let lastSubmittedFingerprint='';
let lastSubmittedAt=0;
function makeRequestId(){return 'REQ-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);}
function transactionFingerprint(action,data){return JSON.stringify({action,partId:data.partId||data.parentPartId||'',qty:data.qty||0,uom:data.uom||'',batchNo:data.batchNo||data.outputBatchNo||'',from:data.fromWarehouseId||'',to:data.toWarehouseId||'',ref:data.referenceNo||'',username:data.username||user().Username||'admin',details:data.details||'',type:data.transactionType||''});}
async function processScannedTransaction(){
  if(transactionBusy){toast('Transaksi sedang diproses. Tunggu sampai selesai.',false);return;}
  if(!lastScan || !lastScan.masterPartId){toast('Scan atau input manual Part Number yang sudah terdaftar di MasterPart.',false);return;}
  const op=selected('scanOperationType');
  if(['receive','transfer','issue'].includes(op)){
    const scannedPart=CACHE.parts.find(x=>String(x.PartID)===String(lastScan.masterPartId));
    const scannedType=String(scannedPart?.PartType||'').trim().toUpperCase().replace(/[-\s]+/g,'_');
    if(scannedType!=='MATERIAL'){ toast('Scan ditolak: Receiving / Transfer / Issue hanya untuk MATERIAL.',false); return; }
  }
  const qty=Number(selected('scanQty')||0);
  const batch=selected('scanBatch');
  const uom=selected('scanUom')||lastScan.uom||'PCS';
  const remarks=selected('scanRemarks');
  if(op!=='stockOpname' && (!qty || qty<=0)){toast('Quantity harus lebih besar dari 0.',false);return;}
  if(!batch && op!=='stockOpname'){toast('Batch No wajib diisi.',false);return;}
  const base={username:user().Username||'admin',partId:lastScan.masterPartId,qty,uom,batchNo:batch,remarks};
  let action=SCAN_OPS[op]?.action; let data={...base};
  if(op==='receive'){data.referenceNo=selected('scanRef');}
  if(op==='transfer'){data.fromWarehouseId=selected('scanFromWh');data.toWarehouseId=selected('scanToWh');}
  if(op==='issue'){data.fromWarehouseId=selected('scanFromWh');}
  if(op==='subAssembly' || op==='finishProduct'){
    data.parentPartId=lastScan.masterPartId;
    data.outputBatchNo=selected('scanOutputBatch')||batch;
    const allowed = op==='subAssembly' ? (CACHE.productionParts?.subAssembly||[]) : (CACHE.productionParts?.finishedGood||[]);
    if(!allowed.some(x=>String(x.PartID)===String(lastScan.masterPartId))){
      throw new Error(op==='subAssembly'
        ? 'Scan ditolak: part bukan Sub Assembly atau tidak memiliki Active BOM.'
        : 'Scan ditolak: part bukan Finished Good atau tidak memiliki Active BOM.');
    }
  }
  if(op==='delivery'){data={username:user().Username||'admin',customerId:selected('scanCustomer'),vehicleNo:selected('scanVehicle'),driverName:selected('scanDriver'),remarks,details:[{partId:lastScan.masterPartId,batchNo:batch,qty,uom}]};}
  if(op==='stockOpname'){data={username:user().Username||'admin',warehouseId:selected('scanOpWh'),opnameDate:new Date().toISOString().slice(0,10),details:[{partId:lastScan.masterPartId,batchNo:batch,physicalQty:Number(selected('scanPhysical')||0),uom,remarks}]};}
  if(['receive','transfer','issue','subAssembly','finishProduct','materialNG','testingPass','testingNG'].includes(op)){

    if(op==='transfer' && (!data.fromWarehouseId||!data.toWarehouseId)){toast('From dan To Warehouse wajib dipilih.',false);return;}
    if(op==='issue' && !data.fromWarehouseId){toast('From Warehouse wajib dipilih.',false);return;}
  }
  if(op==='delivery' && (!data.customerId||!batch||qty<=0)){toast('Customer, Batch dan Qty wajib valid.',false);return;}
  if(op==='stockOpname' && !data.warehouseId){toast('Warehouse wajib dipilih.',false);return;}
  if(!action){toast('Operation tidak valid.',false);return;}
  const fp=transactionFingerprint(action,data);
  const now=Date.now();
  if(fp===lastSubmittedFingerprint && now-lastSubmittedAt<10000){toast('Transaksi yang sama baru saja dikirim. Double input diblokir.',false);return;}
  if(!confirm('Simpan transaksi '+(SCAN_OPS[op]?.label||op)+' untuk '+lastScan.partNumber+'?')) return;
  transactionBusy=true; lastSubmittedFingerprint=fp; lastSubmittedAt=now;
  const btn=document.querySelector('#scanOperation .scan-submit .primary');
  if(btn){btn.disabled=true;btn.textContent='PROCESSING...';}
  data.requestId=makeRequestId();
  try{
    const res=await apiPost(action,data);
    if(!res.success) throw new Error(res.message||'Transaksi gagal');
    toast(res.message||'Transaksi berhasil');
    clearScan();
    await refreshStockOnly();
    renderScanOperation();
  }catch(e){toast(e.message||'Transaksi gagal',false)}
  finally{
    transactionBusy=false;
    const b=document.querySelector('#scanOperation .scan-submit .primary');
    if(b){b.disabled=false;b.textContent='PROCESS TRANSACTION';}
  }
}

function localValidate(rows){const c=IMPORT_CONFIG[_importType],errors=[],seen={};rows.forEach((r,i)=>{const row=i+2;c.required.forEach(k=>{if(String(r[k]??'').trim()==='')errors.push({row,message:k+' wajib diisi'});});let key='';if(_importType==='master')key=String(r.PartNumber||'').trim().toUpperCase();if(_importType==='bom')key=String(r.BOMNo||'').trim().toUpperCase()+'|'+String(r.ComponentPartNumber||'').trim().toUpperCase();if(_importType==='stock')key=String(r.PartNumber||'').trim().toUpperCase()+'|'+String(r.Warehouse||'').trim().toUpperCase()+'|'+String(r.BatchNo||'').trim().toUpperCase();if(key){if(seen[key])errors.push({row,message:'Duplicate key di file: '+key});seen[key]=true;}if(_importType==='master'){const min=Number(r.MinStock||0),max=Number(r.MaxStock||0);if(Number.isNaN(min)||Number.isNaN(max))errors.push({row,message:'MinStock/MaxStock harus angka'});if(max>0&&min>max)errors.push({row,message:'MinStock > MaxStock'});}if(_importType==='bom'&&(Number(r.QtyPer)<=0||Number.isNaN(Number(r.QtyPer))))errors.push({row,message:'QtyPer harus > 0'});if(_importType==='stock'&&(Number(r.Qty)<=0||Number.isNaN(Number(r.Qty))))errors.push({row,message:'Qty harus > 0'});});return errors;}

async function postTestingResult_(x,action){
  const qty=Number(v('testingQty')||0);
  if(!qty||qty<=0){toast('Testing Qty harus lebih besar dari 0.',false);return;}
  const available=Number(x.QtyAvailable ?? x.QtyOnHand ?? 0);

  if(action==='testingNG' && !v('testingRemarks')){toast('Alasan NG wajib diisi.',false);return;}
  const sourceLot=v('testingSourceLot')||x.BatchNo||'';
  if(!sourceLot){toast('Source Lot wajib diisi.',false);return;}
  const label=action==='testingPass'?'Testing PASS':'Testing NG';
  if(!confirm(`${label}: ${x.PartNumber} | Source Lot ${sourceLot} | Qty ${qty}?`))return;
  try{
    const r=await apiPost(action,{username:user().Username||'admin',partId:x.PartID,qty,uom:x.UOM||'PCS',batchNo:sourceLot,referenceNo:v('testingRef'),remarks:v('testingRemarks'),requestId:makeRequestId()});

    toast(r.message||label+' berhasil.');
    await refreshStockOnly();
    await loadTestingQueue_();
  }catch(e){toast(e.message||label+' gagal.',false);}
}

function normalizeOpnameHeader(x){

function opnameDate_(value){
  if(value instanceof Date && !isNaN(value.getTime())) return value.toISOString().slice(0,10);
  const s=String(value??'').trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){
    const [d,m,y]=s.split('/'); return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  return s;
}

  })).filter(x=>x.opnameNo||x.opnameDate||x.warehouse||x.partNumber||x.batchNo||String(x.physicalQty??'').trim()!=='');
}
function findOpnameSystemQty_(partId,warehouseId,batchNo){
  const stock=(CACHE.stock||[]).find(x=>String(x.PartID||'').trim()===String(partId).trim() && String(x.WarehouseID||'').trim()===String(warehouseId).trim() && String(x.BatchNo??'').trim()===String(batchNo??'').trim());
  return Number(stock?.QtyOnHand||0);
}
function validateUploadedOpnameRows(rows){
  const errors=[];const valid=[];const seen=new Set();
  const warehouses=CACHE.warehouses||[];const parts=CACHE.parts||[];
  const whByCode=new Map(warehouses.map(w=>[String(w.WarehouseCode||'').trim().toUpperCase(),w]));
  const partByNo=new Map(parts.map(p=>[String(p.PartNumber||'').trim().toUpperCase(),p]));
  rows.forEach(r=>{
    const rowErrors=[];
    if(!r.opnameNo)rowErrors.push('OpnameNo wajib');
    if(!r.opnameDate || isNaN(new Date(r.opnameDate).getTime()))rowErrors.push('OpnameDate tidak valid');
    const wh=whByCode.get(r.warehouse.toUpperCase());
    if(!r.warehouse)rowErrors.push('Warehouse wajib'); else if(!wh)rowErrors.push('Warehouse tidak ditemukan');
    const part=partByNo.get(r.partNumber.toUpperCase());
    if(!r.partNumber)rowErrors.push('PartNumber wajib'); else if(!part)rowErrors.push('PartNumber tidak ditemukan di MasterPart');
    const physical=Number(r.physicalQty);
    if(String(r.physicalQty??'').trim()==='' || !Number.isFinite(physical) || physical<0)rowErrors.push('PhysicalQty harus angka >= 0');
    const key=(r.warehouse.toUpperCase())+'|'+r.partNumber.toUpperCase()+'|'+r.batchNo.toUpperCase();
    if(seen.has(key))rowErrors.push('Duplicate Warehouse + PartNumber + BatchNo'); else seen.add(key);
    const systemQty=(wh&&part)?findOpnameSystemQty_(part.PartID,wh.WarehouseID,r.batchNo):0;
    const diff=Number.isFinite(physical)?physical-systemQty:0;
    const item={...r,warehouseId:wh?.WarehouseID||'',partId:part?.PartID||'',partName:part?.PartName||'',systemQty,uom:r.uom||part?.UOM||'PCS',difference:diff,errors:rowErrors};
    if(rowErrors.length)errors.push(item); else valid.push(item);
  });
  return {errors,valid,all:[...valid,...errors]};
}
function renderUploadedOpnameValidation(result){
  const all=result.all||[];const diffCount=all.filter(x=>!x.errors.length&&Number(x.difference)!==0).length;
  document.getElementById('opTotal').textContent=all.length;
  document.getElementById('opValid').textContent=result.valid.length;
  document.getElementById('opErrors').textContent=result.errors.length;

  badge.textContent=result.errors.length?'VALIDATION ERROR':'VALIDATION OK';

  msg.textContent=result.errors.length?`File ditolak: ${result.errors.length} row harus diperbaiki sebelum POST.`:`Validasi berhasil: ${result.valid.length} row siap POST. ${diffCount} row memiliki selisih dan akan dibuat sebagai STOCK_ADJUSTMENT.`;
  const h=`<table class="data-table"><thead><tr><th>Row</th><th>OpnameNo</th><th>Warehouse</th><th>Part Number</th><th>Part Name</th><th>Batch</th><th>System Qty</th><th>Physical Qty</th><th>Difference</th><th>UOM</th><th>Validation</th></tr></thead><tbody>`+
    all.map(x=>`<tr class="${x.errors.length?'row-error':''}"><td>${x._row}</td><td>${esc(x.opnameNo)}</td><td>${esc(x.warehouse)}</td><td>${esc(x.partNumber)}</td><td>${esc(x.partName||'-')}</td><td>${esc(x.batchNo||'-')}</td><td>${fmt(x.systemQty)}</td><td>${fmt(x.physicalQty)}</td><td>${fmt(x.difference)}</td><td>${esc(x.uom)}</td><td>${esc(x.errors.length?x.errors.join('; '):'OK')}</td></tr>`).join('')+
    `</tbody></table>`;
  document.getElementById('opnameUploadPreview').innerHTML=h;
  document.getElementById('postUploadedOpname').disabled=!!result.errors.length || !result.valid.length;
  window._uploadedOpnameValidRows=result.valid;
}
function handleOpnameExcel(e){
  const file=e.target.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(sheet,{defval:''});
      const required=['OpnameNo','OpnameDate','Warehouse','PartNumber','BatchNo','PhysicalQty','UOM','Remarks'];
      const headers=(XLSX.utils.sheet_to_json(sheet,{header:1,defval:''})[0]||[]).map(normalizeOpnameHeader);
      const missing=required.filter(x=>!headers.includes(normalizeOpnameHeader(x)));
      if(missing.length){
        document.getElementById('opnameValidationMessage').className='error';
        document.getElementById('opnameValidationMessage').textContent='Kolom wajib tidak ditemukan: '+missing.join(', ');
        document.getElementById('postUploadedOpname').disabled=true;return;
      }
      window._uploadedOpnameRows=normalizeOpnameUploadRows(raw);
      const result=validateUploadedOpnameRows(window._uploadedOpnameRows);
      renderUploadedOpnameValidation(result);
    }catch(err){
      toast('Excel Stock Opname gagal dibaca: '+err.message,false);
      document.getElementById('postUploadedOpname').disabled=true;
    }
  };
  reader.readAsArrayBuffer(file);
}
async function postUploadedOpname(){
  const rows=window._uploadedOpnameValidRows||[];
  if(!rows.length){toast('Belum ada data Stock Opname yang valid.',false);return;}
  const groups={};
  rows.forEach(r=>{const key=r.opnameNo+'|'+r.opnameDate+'|'+r.warehouseId;(groups[key] ||= []).push(r);});
  const keys=Object.keys(groups);
  if(keys.length!==1){toast('Untuk POST, satu file harus memiliki 1 OpnameNo + 1 tanggal + 1 warehouse. Pisahkan file jika berbeda.',false);return;}
  const g=groups[keys[0]];const first=g[0];
  if(!confirm(`POST Stock Opname ${first.opnameNo} | ${first.warehouse} | ${g.length} item? Selisih akan menyesuaikan InventoryBalance.`))return;
  const btn=document.getElementById('postUploadedOpname');btn.disabled=true;btn.textContent='POSTING...';
  try{
    const data={warehouseId:first.warehouseId,opnameDate:first.opnameDate,referenceNo:first.opnameNo,details:g.map(x=>({partId:x.partId,batchNo:x.batchNo,physicalQty:Number(x.physicalQty),uom:x.uom,remarks:x.remarks}))};
    const r=await apiPost('stockOpname',{...data,username:user().Username||'admin',requestId:makeRequestId()});
    if(!r.success)throw new Error(r.message||'Stock Opname gagal.');

}


function reportDateValue_(v){
  if(!v)return '';
  const d=new Date(v);
  return Number.isNaN(d.getTime())?'':d.toISOString().slice(0,10);
}
function reportDateInRange_(value,from,to){
  const d=reportDateValue_(value);
  if(from&&d<from)return false;
  if(to&&d>to)return false;
  return true;
}
function reportDownload_(rows,sheetName,fileName){
  if(!window.XLSX){toast('Library Excel belum tersedia.',false);return;}
  const ws=XLSX.utils.json_to_sheet(rows||[]);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,String(sheetName||'Report').slice(0,31));
  XLSX.writeFile(wb,fileName||'WMS_Report.xlsx');
}

async function loadStockCard_(){
  const partId=v('scPart'),warehouseId=v('scWh'),fromDate=v('scFrom'),toDate=v('scTo'),batchNo=String(v('scBatch')||'').trim();
  if(!partId||!warehouseId){toast('Part Number dan Warehouse wajib dipilih.',false);return;}
  const box=document.getElementById('stockCardTable');
  box.innerHTML='<div class="empty">Loading Stock Card...</div>';
  try{
    // Gunakan endpoint transactions yang sudah ada agar Stock Card tidak membutuhkan perubahan engine.gs.
    const r=await apiGet('transactions',{limit:5000});
    const txs=Array.isArray(r?.data)?r.data:(Array.isArray(r)?r:[]);
    const part=(CACHE.parts||[]).find(x=>String(x.PartID)===String(partId))||{};
    const warehouse=(CACHE.warehouses||[]).find(x=>String(x.WarehouseID)===String(warehouseId))||{};
    const whMap=Object.fromEntries((CACHE.warehouses||[]).map(x=>[String(x.WarehouseID),x.WarehouseCode||x.WarehouseID]));
    const filtered=txs.filter(x=>{
      if(String(x.PartID||'')!==String(partId))return false;
      if(String(x.Status||'').toUpperCase()!=='COMPLETED')return false;
      if(batchNo && String(x.BatchNo||'').trim()!==batchNo)return false;
      return true;
    }).sort((a,b)=>new Date(a.TransactionDate||a.CreatedAt||0)-new Date(b.TransactionDate||b.CreatedAt||0));

    const movementOf=(x)=>{
      const from=String(x.FromWarehouseID||'');
      const to=String(x.ToWarehouseID||'');
      const qty=Math.abs(Number(x.Qty||0));
      if(to===String(warehouseId) && from!==String(warehouseId))return {inQty:qty,outQty:0};
      if(from===String(warehouseId) && to!==String(warehouseId))return {inQty:0,outQty:qty};
      if(to===String(warehouseId) && from===String(warehouseId))return {inQty:0,outQty:0};
      return null;
    };

    let opening=0;
    const rows=[];
    filtered.forEach(x=>{
      const mv=movementOf(x); if(!mv)return;
      const d=reportDateValue_(x.TransactionDate||x.CreatedAt);
      const inPeriod=reportDateInRange_(x.TransactionDate||x.CreatedAt,fromDate,toDate);
      if(fromDate && d<fromDate){opening+=mv.inQty-mv.outQty;return;}
      if(toDate && d>toDate)return;
      if(inPeriod)rows.push({...x,InQty:mv.inQty,OutQty:mv.outQty});
    });

    // Backend lama tidak menyediakan endpoint stockCard. Seluruh perhitungan dilakukan
    // dari Transaction yang sudah ada, sehingga engine.gs tidak perlu diganti.
    rows.sort((a,b)=>new Date(a.TransactionDate||a.CreatedAt||0)-new Date(b.TransactionDate||b.CreatedAt||0));
    renderStockCard_({
      success:true,
      part:{PartNumber:part.PartNumber||'',PartName:part.PartName||'',UOM:part.UOM||''},
      warehouse:{WarehouseCode:warehouse.WarehouseCode||warehouseId,WarehouseName:warehouse.WarehouseName||''},
      batchNo:batchNo,
      openingQty:opening,
      closingQty:opening+rows.reduce((a,x)=>a+Number(x.InQty||0)-Number(x.OutQty||0),0),
      movements:rows
    });
  }catch(e){box.innerHTML=`<div class="message err show">${esc(e.message||'Gagal mengambil Stock Card.')}</div>`;window._stockCardExport=[];}
}
function renderStockCard_(r){
  const movements=r.movements||[], opening=Number(r.openingQty||0),closing=Number(r.closingQty||opening);

  let running=opening;

  const whMap=Object.fromEntries((CACHE.warehouses||[]).map(x=>[String(x.WarehouseID),x.WarehouseCode||x.WarehouseID]));
  window._stockCardExport=[{Date:'',TransactionNo:'',Type:'OPENING BALANCE',ReferenceNo:'',BatchNo:r.batchNo||'ALL',InQty:'',OutQty:'',Balance:opening,UOM:r.part?.UOM||'',FromWarehouse:'',ToWarehouse:'',Status:'',CreatedBy:'',Remarks:'Opening balance before period'},...rows.map(x=>({Date:reportDateValue_(x.TransactionDate),TransactionNo:x.TransactionNo||'',Type:x.TransactionType||'',ReferenceNo:x.ReferenceNo||'',BatchNo:x.BatchNo||'',InQty:Number(x.InQty||0),OutQty:Number(x.OutQty||0),Balance:Number(x.RunBalance||0),UOM:x.UOM||r.part?.UOM||'',FromWarehouse:whMap[String(x.FromWarehouseID||'')]||x.FromWarehouseID||'',ToWarehouse:whMap[String(x.ToWarehouseID||'')]||x.ToWarehouseID||'',Status:x.Status||'',CreatedBy:x.CreatedBy||'',Remarks:x.Remarks||''}))];
  if(!rows.length){document.getElementById('stockCardTable').innerHTML='<div class="empty">Tidak ada movement pada periode/filter tersebut.</div>';return;}
  document.getElementById('stockCardTable').innerHTML=`<table class="data-table"><thead><tr><th>Date</th><th>Transaction</th><th>Type</th><th>Reference</th><th>Batch</th><th>IN</th><th>OUT</th><th>Balance</th><th>UOM</th><th>From</th><th>To</th><th>Status</th></tr></thead><tbody><tr style="font-weight:800"><td>${esc(v('scFrom')||'')}</td><td>—</td><td>OPENING</td><td>—</td><td>${esc(r.batchNo||'ALL')}</td><td>—</td><td>—</td><td>${fmt(opening)}</td><td>${esc(r.part?.UOM||'')}</td><td>—</td><td>—</td><td>—</td></tr>${rows.map(x=>`<tr><td>${esc(reportDateValue_(x.TransactionDate))}</td><td>${esc(x.TransactionNo||'')}</td><td>${esc(x.TransactionType||'')}</td><td>${esc(x.ReferenceNo||'')}</td><td>${esc(x.BatchNo||'')}</td><td>${x.InQty?fmt(x.InQty):'—'}</td><td>${x.OutQty?fmt(x.OutQty):'—'}</td><td><b>${fmt(x.RunBalance)}</b></td><td>${esc(x.UOM||r.part?.UOM||'')}</td><td>${esc(whMap[String(x.FromWarehouseID||'')]||x.FromWarehouseID||'')}</td><td>${esc(whMap[String(x.ToWarehouseID||'')]||x.ToWarehouseID||'')}</td><td>${esc(x.Status||'')}</td></tr>`).join('')}</tbody></table>`;

async function saveTransactionRevision_(row){

async function submit(action,data,label,buttonId=null){
  if(transactionBusy){toast('Transaksi sedang diproses. Double input diblokir.',false);return;}
  const fp=transactionFingerprint(action,data),now=Date.now();
  if(fp===lastSubmittedFingerprint && now-lastSubmittedAt<10000){toast('Transaksi yang sama baru saja dikirim. Double input diblokir.',false);return;}
  const active=document.querySelector('.nav-item.active')?.dataset.page||'dashboard';
  const btn=buttonId?document.getElementById(buttonId):document.querySelector('#saveBtn,#saveDelivery,#saveOp');
  transactionBusy=true;lastSubmittedFingerprint=fp;lastSubmittedAt=now;
  if(btn){btn.disabled=true;btn.dataset.oldText=btn.textContent;btn.textContent='PROCESSING...';}
  try{
    const r=await apiPost(action,{...data,username:user().Username||'admin',requestId:makeRequestId()});
    if(!r.success)throw Error(r.message||label+' gagal');
    toast(label+' berhasil');
    if(['receive','transfer','issue','subAssembly','finishProduct','materialNG','testingPass','testingNG','delivery','stockOpname'].includes(action)){await refreshStockOnly();go(active)}else{await refreshAll();go(active)}
  }catch(e){toast(e.message||label+' gagal',false)}
  finally{transactionBusy=false;if(btn){btn.disabled=false;btn.textContent=btn.dataset.oldText||'Save';}}
}
function v(id){return document.getElementById(id)?.value?.trim()||''}
async function refreshStockOnly(){try{const r=await apiGet('stock');if(r.success)CACHE.stock=r.data||[]}catch(e){}}
async function refreshAll(){await loadCache();go(document.querySelector('.nav-item.active')?.dataset.page||'dashboard')}
document.getElementById('logoutBtn').onclick=()=>{logoutUser();};document.getElementById('refreshBtn').onclick=refreshAll;document.getElementById('mobileMenu').onclick=()=>document.querySelector('.sidebar').classList.toggle('open');
async function handleLogin(event){
  event.preventDefault();
  const msg=document.getElementById('loginMessage');
  const btn=document.querySelector('#loginForm button');
  msg.textContent='Memproses login...';
  btn.disabled=true;
  try{
    const username=document.getElementById('username').value.trim();
    const password=document.getElementById('password').value;
    const result=await loginUser(username,password);
    if(!result.success) throw new Error(result.message||'Login gagal.');
    sessionStorage.setItem('wmsUser',JSON.stringify(result.user));
    showApp(result.user);
    await loadCache();
    go('dashboard');
  }catch(e){msg.textContent=e.message||'Login gagal.';}
  finally{btn.disabled=false;}
}
function showApp(u){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');
  document.getElementById('userInfo').textContent=`${u.FullName||u.Username||'-'}`;document.getElementById('roleBadge').textContent=(u.Role||'').toUpperCase();buildNav();
}
document.getElementById('loginForm').addEventListener('submit',handleLogin);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&html5Scanner){document.getElementById('scanPageWrap')?.classList.remove('scan-fullscreen-wrap');document.body.classList.remove('scan-active');}});
(async()=>{
  buildNav();
  const raw=sessionStorage.getItem('wmsUser');
  if(raw){
    try{
      const u=JSON.parse(raw);
      if(u&&u.Username){showApp(u);await loadCache();go('dashboard');return;}
    }catch(e){sessionStorage.removeItem('wmsUser');}
  }
  try{await apiGet('test');document.getElementById('apiState').textContent='● API Ready';document.getElementById('apiState').className='api-state good';}catch(e){document.getElementById('loginMessage').textContent='API tidak dapat dihubungi: '+e.message;}
})();
document.addEventListener('click',e=>{if(window.innerWidth<=900 && document.querySelector('.sidebar.open') && !e.target.closest('.sidebar') && !e.target.closest('#mobileMenu')) document.querySelector('.sidebar').classList.remove('open');});
</script></body></html>
