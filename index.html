async function apiGet(action, params={}) {
  const q = new URLSearchParams({action, username:(user().Username||''), ...params});
  const r = await fetch(WMS_API_BASE + '?' + q.toString(), {method:'GET', credentials:'same-origin'});
  const text = await r.text();
  try { return JSON.parse(text); } catch(e) { throw new Error('Response API tidak valid: ' + text.slice(0,200)); }
}
async function apiPost(action, data={}) {
  const payload = {...data, action};
  const r = await fetch(WMS_API_BASE, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload), credentials:'same-origin'});
  const text = await r.text();
  try { return JSON.parse(text); } catch(e) { throw new Error('Response API tidak valid: ' + text.slice(0,300)); }
}

async function loadCache(){const jobs=[['parts','parts'],['warehouses','warehouses'],['customers','customers'],['stock','stock'],['productionParts','productionParts']];const results=await Promise.all(jobs.map(async([k,a])=>{try{return [k,await apiGet(a)]}catch(e){return [k,{success:false,error:e}]}}));results.forEach(([k,r])=>{if(r.success)CACHE[k]=r.data||[]});}
function openNavSectionFor(page){const b=document.querySelector(`.nav-item[data-page="${page}"]`);if(!b)return;const sec=b.closest('.nav-section');if(!sec)return;const group=sec.querySelector('.nav-group');const head=sec.querySelector('.nav-sec');if(group&&!group.classList.contains('open')){group.classList.add('open');head.classList.add('open');}}
function go(page){openNavSectionFor(page);if(!canAccessPage(page)){toast('Akses ditolak. Menu ini khusus ADMIN.',false);return;}if(page!=='scan'&&document.getElementById('scanPageWrap')?.classList.contains('scan-fullscreen-wrap')){exitScanFullscreen();}const m=META[page]||META.dashboard;document.getElementById('pageTitle').textContent=m[0];document.getElementById('pageSub').textContent=m[1];document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.page===page));document.getElementById('nav').classList.remove('open');if(page==='dashboard')dashboard();else if(page==='scan')scanPage();else if(page==='stock')stockPage();else if(page==='stock-summary')stockSummaryPage();else if(page==='transactions')txPage();else if(page==='receiving')receivingPage();else if(page==='transfer')transferPage();else if(page==='issue')issuePage();else if(page==='production')productionPage();else if(page==='testing')testingPage();else if(page==='delivery')deliveryPage();else if(page==='stock-opname')opnamePage();else if(page==='master-part')masterPartPage();else if(page==='warehouse')warehousePage();else if(page==='customer')customerPage();else if(page==='bom')bomPage();else if(page==='import-center')importCenterPage();}

    document.getElementById('k2').textContent=fmt(x.issueToday);
    document.getElementById('k3').textContent=fmt(x.consumptionToday);
    document.getElementById('k4').textContent=fmt(x.materialNgToday);
    document.getElementById('k5').textContent=fmt(x.fgDeliveryToday);
    document.getElementById('dBalance').textContent=fmt(x.balanceLines);

    const wm={};CACHE.warehouses.forEach(w=>wm[w.WarehouseID]=w);
    const sums={};CACHE.stock.forEach(s=>sums[s.WarehouseID]=(sums[s.WarehouseID]||0)+Number(s.QtyOnHand||0));
    const max=Math.max(1,...Object.values(sums));
    document.getElementById('whChart').innerHTML=Object.entries(sums).sort((a,b)=>b[1]-a[1]).map(([id,q])=>`<div class="bar"><span>${esc(wm[id]?.WarehouseCode||id)}</span><div><i style="width:${q/max*100}%"></i></div><b>${fmt(q)}</b></div>`).join('')||'<div class="empty">No data</div>';

    const pm={};CACHE.parts.forEach(p=>pm[p.PartID]=p);
    const ps={};CACHE.stock.forEach(s=>ps[s.PartID]=(ps[s.PartID]||0)+Number(s.QtyOnHand||0));
    document.getElementById('topStock').innerHTML=Object.entries(ps).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,q],i)=>`<div class="rank"><em>${i+1}</em><span><b>${esc(pm[id]?.PartNumber||id)}</b><small>${esc(pm[id]?.PartName||'')}</small></span><strong>${fmt(q)}</strong></div>`).join('')||'<div class="empty">No data</div>';

    const cats={};Object.entries(ps).forEach(([id,q])=>{const c=pm[id]?.Category||'Other';cats[c]=(cats[c]||0)+q});
    const ct=Object.values(cats).reduce((a,b)=>a+b,0)||1;
    document.getElementById('catChart').innerHTML=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([c,q])=>`<div class="cat"><span>${esc(c)}</span><b>${Math.round(q/ct*100)}%</b><div><i style="width:${q/ct*100}%"></i></div></div>`).join('')||'<div class="empty">No data</div>';

    document.getElementById('recent').innerHTML=(t.data||[]).map(z=>`<div class="tx"><span><b>${esc(z.TransactionType)}</b><small>${esc(pm[z.PartID]?.PartNumber||z.PartID||'-')} · ${esc(z.BatchNo||'-')}</small></span><strong>${fmt(z.Qty)}</strong><small>${esc(z.CreatedBy||'-')}</small></div>`).join('')||'<div class="empty">No data</div>';
    document.getElementById('statusDetail').textContent=`${CACHE.stock.length} balance lines · ${t.data?.length||0} recent transactions loaded`;
    document.getElementById('apiState').textContent='● API Connected';
    document.getElementById('apiState').className='api-state good';
  }catch(e){
    document.getElementById('statusDetail').textContent=e.message;

    document.getElementById('apiState').className='api-state bad';

}

    return {...s,PartNumber:p.PartNumber||s.PartID||'',PartName:p.PartName||'',Category:p.Category||'',WarehouseCode:w.WarehouseCode||s.WarehouseID||'',WarehouseName:w.WarehouseName||'',WarehouseLabel:(w.WarehouseCode?`${w.WarehouseCode} — ${w.WarehouseName||''}`:s.WarehouseID||'')};

function setSelectValue(id,value){const el=document.getElementById(id);if(!el)return false;const v=String(value??'');const exists=[...el.options].some(o=>o.value===v);if(exists){el.value=v;el.dispatchEvent(new Event('change'));return true;}return false;}
function setInputValue(id,value){const el=document.getElementById(id);if(el){el.value=value??'';el.dispatchEvent(new Event('input'));return true;}return false;}
function applyScanToTransaction(prefix,op,r){
  if(!r.masterPartId){setScanStatus(prefix,'Part terbaca tetapi belum terdaftar di MasterPart.',false);return false;}
  const partTargets={receive:'partId',transfer:'partId',issue:'partId',subAssembly:'saPart',finishProduct:'fpPart',testingPass:'tpPart',testingNG:'tnPart',materialNG:'ngPart',delivery:'diPart1'};
  const qtyTargets={receive:'qty',transfer:'qty',issue:'qty',subAssembly:'saQty',finishProduct:'fpQty',testingPass:'tpQty',testingNG:'tnQty',materialNG:'ngQty',delivery:'diQty1'};
  const batchTargets={receive:'batchNo',transfer:'batchNo',issue:'batchNo',subAssembly:'saBatch',finishProduct:'fpBatch',testingPass:'tpBatch',testingNG:'tnBatch',materialNG:'ngBatch',delivery:'diBatch1'};
  const uomTargets={receive:'uom',transfer:'uom',issue:'uom'};
  const partId=partTargets[op];
  if(partId && !setSelectValue(partId,r.masterPartId)){setScanStatus(prefix,'Part ditemukan di parser tetapi belum tersedia pada daftar Part di form.',false);return false;}
  if(qtyTargets[op] && r.qty!==null) setInputValue(qtyTargets[op],r.qty);
  if(batchTargets[op] && r.batchNo) setInputValue(batchTargets[op],r.batchNo);
  if(uomTargets[op]) setInputValue(uomTargets[op],r.uom||r.masterUom||'PCS');
  if(op==='receive' && r.po) setInputValue('referenceNo',r.po);
  if(op==='stockOpname'){
    setInputValue('scanOpPhysical',r.qty??'');
    setInputValue('scanOpBatch',r.batchNo||'');
    setSelectValue('scanOpPart',r.masterPartId);
    if(v('opWh')) setTimeout(applyOpScan,0);
  }
  setScanStatus(prefix,`✓ ${r.partNumber} | Qty: ${r.qty===null?'-':fmt(r.qty)} | Batch: ${r.batchNo||'-'}`,true);
  return true;
}
function setScanStatus(prefix,msg,ok=true){const el=document.getElementById(prefix+'ScanStatus');if(el){el.textContent=msg;el.className='inline-scan-status '+(ok?'ok':'err');}}
function handleInlineScan(prefix,op,raw){if(!raw)return;try{const r=parseWmsQR(raw);window._inlineScans=window._inlineScans||{};window._inlineScans[prefix]=r;const ok=applyScanToTransaction(prefix,op,r);if(ok)toast('Scan berhasil: '+r.partNumber+(r.qty!==null?' | Qty '+r.qty:''));}catch(e){setScanStatus(prefix,e.message||'Format QR tidak valid.',false);toast(e.message||'Format QR tidak valid.',false)}}
function lookupInlinePart(prefix,op){const pn=String(document.getElementById(prefix+'ManualPart')?.value||'').trim();if(!pn){toast('Masukkan Part Number.',false);return;}const master=CACHE.parts.find(x=>String(x.PartNumber||'').trim().toUpperCase()===pn.toUpperCase());if(!master){setScanStatus(prefix,'Part Number tidak ditemukan di MasterPart: '+pn,false);toast('Part Number tidak ditemukan di MasterPart.',false);return;}if(['receive','transfer','issue'].includes(op)){const mt=String(master.PartType||'').trim().toUpperCase().replace(/[-\s]+/g,'_');if(mt!=='MATERIAL'){setScanStatus(prefix,'Hanya MATERIAL yang boleh digunakan untuk Receiving / Transfer / Issue.',false);toast('Part bukan MATERIAL.',false);return;}}const r={raw:'MANUAL:'+pn,partNumber:master.PartNumber||pn,partName:master.PartName||'',uom:master.UOM||'PCS',qty:null,batchNo:'',lot:'',po:'',date:'',dn:'',serial:'',serialNumber:'',vendor:'',plant:'',expiryDate:'',qRaw:'',fields:{},masterPartId:master.PartID,masterUom:master.UOM||'PCS',masterFound:true,manual:true};window._inlineScans=window._inlineScans||{};window._inlineScans[prefix]=r;applyScanToTransaction(prefix,op,r);toast('Part ditemukan: '+r.partNumber);}

let transactionBusy=false;
let lastSubmittedFingerprint='';
let lastSubmittedAt=0;
function makeRequestId(){return 'REQ-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);}
function transactionFingerprint(action,data){return JSON.stringify({action,partId:data.partId||data.parentPartId||'',qty:data.qty||0,uom:data.uom||'',batchNo:data.batchNo||data.outputBatchNo||'',from:data.fromWarehouseId||'',to:data.toWarehouseId||'',ref:data.referenceNo||'',username:data.username||user().Username||'admin',details:data.details||'',type:data.transactionType||''});}
async function processScannedTransaction(){
  if(transactionBusy){toast('Transaksi sedang diproses. Tunggu sampai selesai.',false);return;}
  if(!lastScan || !lastScan.masterPartId){toast('Scan atau input manual Part Number yang sudah terdaftar di MasterPart.',false);return;}
  const op=selected('scanOperationType');
  if(['receive','transfer','issue'].includes(op)){
    const scannedPart=CACHE.parts.find(x=>String(x.PartID)===String(lastScan.masterPartId));
    const scannedType=String(scannedPart?.PartType||'').trim().toUpperCase().replace(/[-\s]+/g,'_');
    if(scannedType!=='MATERIAL'){ toast('Scan ditolak: Receiving / Transfer / Issue hanya untuk MATERIAL.',false); return; }
  }
  const qty=Number(selected('scanQty')||0);
  const batch=selected('scanBatch');
  const uom=selected('scanUom')||lastScan.uom||'PCS';
  const remarks=selected('scanRemarks');
  if(op!=='stockOpname' && (!qty || qty<=0)){toast('Quantity harus lebih besar dari 0.',false);return;}
  if(!batch && op!=='stockOpname'){toast('Batch No wajib diisi.',false);return;}
  const base={username:user().Username||'admin',partId:lastScan.masterPartId,qty,uom,batchNo:batch,remarks};
  let action=SCAN_OPS[op]?.action; let data={...base};
  if(op==='receive'){data.referenceNo=selected('scanRef');}
  if(op==='transfer'){data.fromWarehouseId=selected('scanFromWh');data.toWarehouseId=selected('scanToWh');}
  if(op==='issue'){data.fromWarehouseId=selected('scanFromWh');}
  if(op==='subAssembly' || op==='finishProduct'){
    data.parentPartId=lastScan.masterPartId;
    data.outputBatchNo=selected('scanOutputBatch')||batch;
    const allowed = op==='subAssembly' ? (CACHE.productionParts?.subAssembly||[]) : (CACHE.productionParts?.finishedGood||[]);
    if(!allowed.some(x=>String(x.PartID)===String(lastScan.masterPartId))){
      throw new Error(op==='subAssembly'
        ? 'Scan ditolak: part bukan Sub Assembly atau tidak memiliki Active BOM.'
        : 'Scan ditolak: part bukan Finished Good atau tidak memiliki Active BOM.');
    }
  }
  if(op==='delivery'){data={username:user().Username||'admin',customerId:selected('scanCustomer'),vehicleNo:selected('scanVehicle'),driverName:selected('scanDriver'),remarks,details:[{partId:lastScan.masterPartId,batchNo:batch,qty,uom}]};}
  if(op==='stockOpname'){data={username:user().Username||'admin',warehouseId:selected('scanOpWh'),opnameDate:new Date().toISOString().slice(0,10),details:[{partId:lastScan.masterPartId,batchNo:batch,physicalQty:Number(selected('scanPhysical')||0),uom,remarks}]};}
  if(['receive','transfer','issue','subAssembly','finishProduct','materialNG','testingPass','testingNG'].includes(op)){

    if(op==='transfer' && (!data.fromWarehouseId||!data.toWarehouseId)){toast('From dan To Warehouse wajib dipilih.',false);return;}
    if(op==='issue' && !data.fromWarehouseId){toast('From Warehouse wajib dipilih.',false);return;}
  }
  if(op==='delivery' && (!data.customerId||!batch||qty<=0)){toast('Customer, Batch dan Qty wajib valid.',false);return;}
  if(op==='stockOpname' && !data.warehouseId){toast('Warehouse wajib dipilih.',false);return;}
  if(!action){toast('Operation tidak valid.',false);return;}
  const fp=transactionFingerprint(action,data);
  const now=Date.now();
  if(fp===lastSubmittedFingerprint && now-lastSubmittedAt<10000){toast('Transaksi yang sama baru saja dikirim. Double input diblokir.',false);return;}
  if(!confirm('Simpan transaksi '+(SCAN_OPS[op]?.label||op)+' untuk '+lastScan.partNumber+'?')) return;
  transactionBusy=true; lastSubmittedFingerprint=fp; lastSubmittedAt=now;
  const btn=document.querySelector('#scanOperation .scan-submit .primary');
  if(btn){btn.disabled=true;btn.textContent='PROCESSING...';}
  data.requestId=makeRequestId();
  try{
    const res=await apiPost(action,data);
    if(!res.success) throw new Error(res.message||'Transaksi gagal');
    toast(res.message||'Transaksi berhasil');
    clearScan();
    await refreshStockOnly();
    renderScanOperation();
  }catch(e){toast(e.message||'Transaksi gagal',false)}
  finally{
    transactionBusy=false;
    const b=document.querySelector('#scanOperation .scan-submit .primary');
    if(b){b.disabled=false;b.textContent='PROCESS TRANSACTION';}
  }
}

function normalizeHeader(x){return String(x??'').trim().replace(/\s+/g,'');}

function handleExcelFile(e){const file=e.target.files?.[0];if(!file)return;_importFileName=file.name;document.getElementById('fileName').textContent=file.name;const reader=new FileReader();reader.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});const sheet=wb.Sheets[wb.SheetNames[0]];_importRows=normalizeRows(XLSX.utils.sheet_to_json(sheet,{defval:''}));document.getElementById('importTotal').textContent=_importRows.length;document.getElementById('importValid').textContent='0';document.getElementById('importErrors').textContent='0';document.getElementById('importMessage').textContent=`File terbaca: ${wb.SheetNames[0]} · ${_importRows.length} row`;document.getElementById('importMessage').className='system-ok';renderImportPreview(_importRows.slice(0,100),[]);document.getElementById('executeImportBtn').disabled=true;}catch(err){toast('Excel gagal dibaca: '+err.message,false);}};reader.readAsArrayBuffer(file);}
function localValidate(rows){const c=IMPORT_CONFIG[_importType],errors=[],seen={};rows.forEach((r,i)=>{const row=i+2;c.required.forEach(k=>{if(String(r[k]??'').trim()==='')errors.push({row,message:k+' wajib diisi'});});let key='';if(_importType==='master')key=String(r.PartNumber||'').trim().toUpperCase();if(_importType==='bom')key=String(r.BOMNo||'').trim().toUpperCase()+'|'+String(r.ComponentPartNumber||'').trim().toUpperCase();if(_importType==='stock')key=String(r.PartNumber||'').trim().toUpperCase()+'|'+String(r.Warehouse||'').trim().toUpperCase()+'|'+String(r.BatchNo||'').trim().toUpperCase();if(key){if(seen[key])errors.push({row,message:'Duplicate key di file: '+key});seen[key]=true;}if(_importType==='master'){const min=Number(r.MinStock||0),max=Number(r.MaxStock||0);if(Number.isNaN(min)||Number.isNaN(max))errors.push({row,message:'MinStock/MaxStock harus angka'});if(max>0&&min>max)errors.push({row,message:'MinStock > MaxStock'});}if(_importType==='bom'&&(Number(r.QtyPer)<=0||Number.isNaN(Number(r.QtyPer))))errors.push({row,message:'QtyPer harus > 0'});if(_importType==='stock'&&(Number(r.Qty)<=0||Number.isNaN(Number(r.Qty))))errors.push({row,message:'Qty harus > 0'});});return errors;}

        <p>PASS memindahkan barang dari TEST ke FG. NG memindahkan barang dari TEST ke HOLD.</p>
        <div id="testingForm"><div class="empty">Pilih item dari queue.</div></div>
      </div>
    </div>`);

  loadTestingQueue_();
}

async function loadTestingQueue_(){
  const box=document.getElementById('testingQueue');
  const form=document.getElementById('testingForm');
  try{
    const r=await apiGet('testingQueue');
    if(!r.success) throw new Error(r.message||'Testing Queue gagal dimuat.');
    const rows=r.data||[];
    window._testingQueue=rows;
    if(!rows.length){
      box.innerHTML='<div class="empty">Tidak ada Finished Product yang menunggu Testing di WH006 / FG.</div>';
      form.innerHTML='<div class="empty">WH006 / FG kosong / tidak ada antrian QC.</div>';
      return;
    }
    const parts=[...new Map(rows.map(x=>[x.PartID,x])).values()];
    box.innerHTML=`<div class="testing-filter-bar"><button class="testing-filter-btn active" data-filter="ALL" onclick="setTestingFilter('ALL',this)">ALL (${rows.length})</button>${parts.map(x=>`<button class="testing-filter-btn" data-filter="${esc(x.PartID)}" onclick="setTestingFilter('${esc(x.PartID)}',this)">${esc(x.PartNumber)}</button>`).join('')}<input class="testing-filter-search" id="testingQueueSearch" placeholder="Search Part Number / Batch"></div><div id="testingQueueTable"></div>`;
    document.getElementById('testingQueueSearch').oninput=()=>renderTestingQueue_();
    window._testingFilter='ALL';
    renderTestingQueue_();
    form.innerHTML='<div class="empty">Pilih barang dari Testing Queue secara manual.</div>';
  }catch(e){
    box.innerHTML=`<div class="error">${esc(e.message)}</div>`;
    form.innerHTML='<div class="empty">Testing Queue tidak dapat dimuat.</div>';
  }
}
function setTestingFilter(filter,btn){
  window._testingFilter=filter;
  document.querySelectorAll('.testing-filter-btn').forEach(x=>x.classList.toggle('active',x===btn));
  renderTestingQueue_();
}
function renderTestingQueue_(){
  const box=document.getElementById('testingQueueTable'); if(!box)return;
  const rows=window._testingQueue||[]; const filter=window._testingFilter||'ALL'; const q=String(document.getElementById('testingQueueSearch')?.value||'').trim().toLowerCase();
  const filtered=rows.filter(x=>(filter==='ALL'||String(x.PartID)===filter)&&[x.PartNumber,x.PartName,x.BatchNo].some(v=>String(v||'').toLowerCase().includes(q)));
  box.innerHTML=filtered.length?`<div class="table-scroll"><table class="data-table testing-queue-table"><thead><tr><th>Part Number</th><th>Part Name</th><th>Batch</th><th>Qty Available</th><th>Action</th></tr></thead><tbody>${filtered.map(x=>{const i=rows.indexOf(x);return `<tr id="testing-row-${i}"><td><b>${esc(x.PartNumber)}</b></td><td>${esc(x.PartName)}</td><td>${esc(x.BatchNo||'-')}</td><td>${fmt(x.QtyAvailable ?? x.QtyOnHand)}</td><td><button class="btn ghost btn-sm" onclick="selectTestingItem(${i})">SELECT</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Tidak ada item sesuai filter.</div>';
}

function selectTestingItem(i){
  const x=(window._testingQueue||[])[i];
  const form=document.getElementById('testingForm');
  if(!x||!form)return;
  const max=Number(x.QtyAvailable ?? x.QtyOnHand ?? 0);
  form.innerHTML=`
    <div class="selected-item">
      <div><small>FINISHED PRODUCT</small><b>${esc(x.PartNumber)}</b><span>${esc(x.PartName||'')}</span></div>
      <div><small>BATCH</small><b>${esc(x.BatchNo||'-')}</b></div>
      <div><small>AVAILABLE IN WH006 / FG</small><b>${fmt(max)}</b></div>
    </div>
    <div class="form-grid">
      ${f('Testing Qty','testingQty','number',`min="0.000001" max="${max}" step="any" value="${max}"`)}
      ${f('Reference','testingRef')}
      ${f('Remarks / Reason','testingRemarks')}
    </div>
    <div class="form-actions">
      <button class="btn primary" id="testingPassBtn">✓ PASS → WH008 / TEST</button>
      <button class="btn danger" id="testingNgBtn">✕ NG → HOLD</button>
    </div>
    <div class="process-note">Flow: <b>WH006 / FG → PASS → WH008 / TEST</b> atau <b>WH006 / FG → NG → WH009 / HOLD</b>. FG Delivery hanya mengambil dari WH008 / TEST.</div>`;

  document.getElementById('testingPassBtn').onclick=()=>postTestingResult_(x,'testingPass');
  document.getElementById('testingNgBtn').onclick=()=>postTestingResult_(x,'testingNG');
}

async function postTestingResult_(x,action){
  const qty=Number(v('testingQty')||0);
  if(!qty||qty<=0){toast('Testing Qty harus lebih besar dari 0.',false);return;}
  const available=Number(x.QtyAvailable ?? x.QtyOnHand ?? 0);
  if(qty>available){toast('Qty Testing melebihi stock yang tersedia di TEST.',false);return;}
  if(action==='testingNG' && !v('testingRemarks')){toast('Alasan NG wajib diisi.',false);return;}
  const label=action==='testingPass'?'Testing PASS':'Testing NG';
  if(!confirm(`${label}: ${x.PartNumber} | Batch ${x.BatchNo} | Qty ${qty}?`))return;
  try{
    const r=await apiPost(action,{username:user().Username||'admin',partId:x.PartID,qty,uom:x.UOM||'PCS',batchNo:x.BatchNo,referenceNo:v('testingRef'),remarks:v('testingRemarks'),requestId:makeRequestId()});
    if(!r.success)throw new Error(r.message||label+' gagal.');
    toast(r.message||label+' berhasil.');
    await refreshStockOnly();
    await loadTestingQueue_();
  }catch(e){toast(e.message||label+' gagal.',false);}
}

function masterPartPage(){shell('Master Part','Create PartID / Part Number master',`<div class="panel quick-import"><div><b>Master Part Import</b><p class="muted">Upload banyak Master Part dari Excel tanpa input satu per satu.</p></div><div class="form-actions"><button class="btn ghost" onclick="openImport('master')">↑ Upload Excel</button><button class="btn ghost" onclick="go('import-center');setTimeout(()=>document.getElementById('downloadTemplateBtn')?.click(),0)">↓ Template</button></div></div>`+formCard([f('Part Number','mpNo'),f('Part Name','mpName'),f('Part Type','mpType','text','value="MATERIAL"'),f('Category','mpCat'),f('UOM','mpUom','text','value="PCS"'),f('Min Stock','mpMin','number','min="0"'),f('Max Stock','mpMax','number','min="0"')],'Save Master Part'));document.getElementById('saveBtn').onclick=()=>submit('saveMaster',{table:'parts',partNumber:v('mpNo'),partName:v('mpName'),partType:v('mpType'),category:v('mpCat'),uom:v('mpUom'),minStock:Number(v('mpMin')),maxStock:Number(v('mpMax'))},'Master Part')}
function warehousePage(){shell('Warehouse','Create warehouse / location',formCard([f('Warehouse Code','whCode'),f('Warehouse Name','whName'),f('Warehouse Type','whType','text','value="STORAGE"'),fs('Parent Warehouse','whParent',sel('whParent',whs(),'None')),f('Status','whStatus','text','value="ACTIVE"')],'Save Warehouse'));document.getElementById('saveBtn').onclick=()=>submit('saveMaster',{table:'warehouses',warehouseCode:v('whCode'),warehouseName:v('whName'),warehouseType:v('whType'),parentWarehouseId:v('whParent'),status:v('whStatus')},'Warehouse')}

function bomPage(){shell('BOM','Bill of Material · Parent → Components',`<div class="panel quick-import"><div><b>BOM Import</b><p class="muted">Upload BOM Header + BOM Detail dari Excel. Parent dan Component Part akan dicari otomatis dari Master Part.</p></div><div class="form-actions"><button class="btn ghost" onclick="openImport('bom')">↑ Upload BOM Excel</button><button class="btn ghost" onclick="go('import-center');setTimeout(()=>{document.querySelector('.import-tab[data-type=\"bom\"]')?.click();document.getElementById('downloadTemplateBtn')?.click()},0)">↓ Template BOM</button></div></div><div class="form-card"><div class="form-grid">${fs('Parent Part','bomParent',sel('bomParent',parts()))}${f('BOM Version','bomVer','text','value="V1"')}${f('Effective Date','bomDate','date','value="'+new Date().toISOString().slice(0,10)+'"')}</div><h4 class="section-title">Components</h4><div id="bomItems"></div><button class="btn ghost" onclick="addBomItem()">+ Add Component</button><div class="form-actions"><button class="btn primary" id="saveBom">Save BOM</button></div></div>`);addBomItem();document.getElementById('saveBom').onclick=saveBom}
let bomCount=0;function addBomItem(){bomCount++;document.getElementById('bomItems').insertAdjacentHTML('beforeend',`<div class="line-item" id="bi${bomCount}">${fs('Component','bc'+bomCount,sel('bc'+bomCount,parts()))}${f('Qty / Unit','bq'+bomCount,'number','min="0.000001" step="any"')}${f('Scrap %','bs'+bomCount,'number','min="0" step="any" value="0"')}<button class="remove" onclick="document.getElementById('bi${bomCount}').remove()">×</button></div>`)}async function saveBom(){const components=[...document.querySelectorAll('#bomItems .line-item')].map(row=>{const id=row.id.slice(2);return{componentPartId:v('bc'+id),qtyPer:Number(v('bq'+id)),uom:'PCS',scrapPercent:Number(v('bs'+id)||0)}});await submit('saveBOM',{parentPartId:v('bomParent'),bomVersion:v('bomVer'),effectiveDate:v('bomDate'),components},'BOM')}
async function submit(action,data,label,buttonId=null){
  if(transactionBusy){toast('Transaksi sedang diproses. Double input diblokir.',false);return;}
  const fp=transactionFingerprint(action,data),now=Date.now();
  if(fp===lastSubmittedFingerprint && now-lastSubmittedAt<10000){toast('Transaksi yang sama baru saja dikirim. Double input diblokir.',false);return;}
  const active=document.querySelector('.nav-item.active')?.dataset.page||'dashboard';
  const btn=buttonId?document.getElementById(buttonId):document.querySelector('#saveBtn,#saveDelivery,#saveOp');
  transactionBusy=true;lastSubmittedFingerprint=fp;lastSubmittedAt=now;
  if(btn){btn.disabled=true;btn.dataset.oldText=btn.textContent;btn.textContent='PROCESSING...';}
  try{
    const r=await apiPost(action,{...data,username:user().Username||'admin',requestId:makeRequestId()});
    if(!r.success)throw Error(r.message||label+' gagal');
    toast(label+' berhasil');
    if(['receive','transfer','issue','subAssembly','finishProduct','materialNG','testingPass','testingNG','delivery','stockOpname'].includes(action)){await refreshStockOnly();go(active)}else{await refreshAll();go(active)}
  }catch(e){toast(e.message||label+' gagal',false)}
  finally{transactionBusy=false;if(btn){btn.disabled=false;btn.textContent=btn.dataset.oldText||'Save';}}
}
function v(id){return document.getElementById(id)?.value?.trim()||''}
async function refreshStockOnly(){try{const r=await apiGet('stock');if(r.success)CACHE.stock=r.data||[]}catch(e){}}
async function refreshAll(){await loadCache();go(document.querySelector('.nav-item.active')?.dataset.page||'dashboard')}
document.getElementById('logoutBtn').onclick=async()=>{await exitScanFullscreen();logoutUser();};document.getElementById('refreshBtn').onclick=refreshAll;document.getElementById('mobileMenu').onclick=()=>document.querySelector('.sidebar').classList.toggle('open');
async function handleLogin(event){
  event.preventDefault();
  const msg=document.getElementById('loginMessage');
  const btn=document.querySelector('#loginForm button');
  msg.textContent='Memproses login...';
  btn.disabled=true;
  try{
    const username=document.getElementById('username').value.trim();
    const password=document.getElementById('password').value;
    const result=await loginUser(username,password);
    if(!result.success) throw new Error(result.message||'Login gagal.');
    sessionStorage.setItem('wmsUser',JSON.stringify(result.user));
    showApp(result.user);
    await loadCache();
    go('dashboard');
  }catch(e){msg.textContent=e.message||'Login gagal.';}
  finally{btn.disabled=false;}
}
function showApp(u){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');
  document.getElementById('userInfo').textContent=`${u.FullName||u.Username||'-'}`;document.getElementById('roleBadge').textContent=(u.Role||'').toUpperCase();buildNav();
}
document.getElementById('loginForm').addEventListener('submit',handleLogin);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){document.getElementById('scanPageWrap')?.classList.remove('scan-fullscreen-wrap');document.body.classList.remove('scan-active');}});
(async()=>{
  buildNav();
  const raw=sessionStorage.getItem('wmsUser');
  if(raw){
    try{
      const u=JSON.parse(raw);
      if(u&&u.Username){showApp(u);await loadCache();go('dashboard');return;}
    }catch(e){sessionStorage.removeItem('wmsUser');}
  }
  try{await apiGet('test');document.getElementById('apiState').textContent='● API Ready';document.getElementById('apiState').className='api-state good';}catch(e){document.getElementById('loginMessage').textContent='API tidak dapat dihubungi: '+e.message;}
})();
document.addEventListener('click',e=>{if(window.innerWidth<=900 && document.querySelector('.sidebar.open') && !e.target.closest('.sidebar') && !e.target.closest('#mobileMenu')) document.querySelector('.sidebar').classList.remove('open');});
</script></body></html>
